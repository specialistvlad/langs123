sections:
  - title:
      en: "Days of the week"
      uk: "Дні тижня"
      es: "Los días de la semana"
      pt: "Os dias da semana"
      fr: "Les jours de la semaine"
      de: "Die Wochentage"
      it: "I giorni della settimana"
      pl: "Dni tygodnia"
      tr: "Haftanın günleri"
      id: "Hari dalam seminggu"
      vi: "Các thứ trong tuần"
    role: "own"
    content:
      - type: "inventory"
        set: "days"
        columns: [{ key: "day", label: { en: "Day", uk: "День", es: "Día", pt: "Dia", fr: "Jour", de: "Tag", it: "Giorno", pl: "Dzień", tr: "Gün", id: "Hari", vi: "Thứ" } }]
        rows:
          - level: "A0"
            value: 7
            day: "にちようび"
            tr: { en: "Sunday", uk: "неділя", es: "domingo", pt: "domingo", fr: "dimanche", de: "Sonntag", it: "domenica", pl: "niedziela", tr: "pazar", id: "Minggu", vi: "chủ nhật" }
          - level: "A0"
            value: 1
            day: "げつようび"
            tr: { en: "Monday", uk: "понеділок", es: "lunes", pt: "segunda-feira", fr: "lundi", de: "Montag", it: "lunedì", pl: "poniedziałek", tr: "pazartesi", id: "Senin", vi: "thứ hai" }
          - level: "A0"
            value: 2
            day: "かようび"
            tr: { en: "Tuesday", uk: "вівторок", es: "martes", pt: "terça-feira", fr: "mardi", de: "Dienstag", it: "martedì", pl: "wtorek", tr: "salı", id: "Selasa", vi: "thứ ba" }
          - level: "A0"
            value: 3
            day: "すいようび"
            tr: { en: "Wednesday", uk: "середа", es: "miércoles", pt: "quarta-feira", fr: "mercredi", de: "Mittwoch", it: "mercoledì", pl: "środa", tr: "çarşamba", id: "Rabu", vi: "thứ tư" }
          - level: "A0"
            value: 4
            day: "もくようび"
            tr: { en: "Thursday", uk: "четвер", es: "jueves", pt: "quinta-feira", fr: "jeudi", de: "Donnerstag", it: "giovedì", pl: "czwartek", tr: "perşembe", id: "Kamis", vi: "thứ năm" }
          - level: "A0"
            value: 5
            day: "きんようび"
            tr: { en: "Friday", uk: "п’ятниця", es: "viernes", pt: "sexta-feira", fr: "vendredi", de: "Freitag", it: "venerdì", pl: "piątek", tr: "cuma", id: "Jumat", vi: "thứ sáu" }
          - level: "A0"
            value: 6
            day: "どようび"
            tr: { en: "Saturday", uk: "субота", es: "sábado", pt: "sábado", fr: "samedi", de: "Samstag", it: "sabato", pl: "sobota", tr: "cumartesi", id: "Sabtu", vi: "thứ bảy" }
      - type: "list"
        items:
          - type: "rule"
            level: "A0"
            text:
              en: ["Every day ends in ", { term: "ようび" }, ", “day of the week”."]
              uk: ["Кожен день тижня закінчується на ", { term: "ようび" }, " — «день тижня»."]
              es: ["Todos los días acaban en ", { term: "ようび" }, ", «día de la semana»."]
              pt: ["Todos os dias terminam em ", { term: "ようび" }, ", «dia da semana»."]
              fr: ["Chaque jour se termine par ", { term: "ようび" }, ", « jour de la semaine »."]
              de: ["Jeder Wochentag endet auf ", { term: "ようび" }, ", „Wochentag“."]
              it: ["Ogni giorno termina con ", { term: "ようび" }, ", «giorno della settimana»."]
              pl: ["Każdy dzień kończy się na ", { term: "ようび" }, ", „dzień tygodnia”."]
              tr: ["Her gün adı, “haftanın günü” demek olan ", { term: "ようび" }, " ile biter."]
              id: ["Setiap nama hari berakhir dengan ", { term: "ようび" }, ", “hari dalam seminggu”."]
              vi: ["Mọi thứ trong tuần đều kết thúc bằng ", { term: "ようび" }, ", nghĩa là “thứ trong tuần”."]
            ex: { examples: [{ weekday: ["げつ", { target: "ようび" }], value: 1 }, { weekday: ["すい", { target: "ようび" }], value: 3 }, { weekday: ["にち", { target: "ようび" }], value: 7 }] }
            tr: { en: { examples: ["Monday", "Wednesday", "Sunday"] }, uk: { examples: ["понеділок", "середа", "неділя"] }, es: { examples: ["lunes", "miércoles", "domingo"] }, pt: { examples: ["segunda-feira", "quarta-feira", "domingo"] }, fr: { examples: ["lundi", "mercredi", "dimanche"] }, de: { examples: ["Montag", "Mittwoch", "Sonntag"] }, it: { examples: ["lunedì", "mercoledì", "domenica"] }, pl: { examples: ["poniedziałek", "środa", "niedziela"] }, tr: { examples: ["pazartesi", "çarşamba", "pazar"] }, id: { examples: ["Senin", "Rabu", "Minggu"] }, vi: { examples: ["thứ hai", "thứ tư", "chủ nhật"] } }
          - type: "note"
            level: "A0"
            text:
              en: "Japanese calendars usually begin the week on Sunday."
              uk: "Японські календарі зазвичай починають тиждень з неділі."
              es: "Los calendarios japoneses suelen empezar la semana en domingo."
              pt: "Os calendários japoneses costumam começar a semana no domingo."
              fr: "Les calendriers japonais commencent le plus souvent la semaine le dimanche."
              de: "Japanische Kalender beginnen die Woche meist mit dem Sonntag."
              it: "I calendari giapponesi di solito iniziano la settimana dalla domenica."
              pl: "Japońskie kalendarze zwykle zaczynają tydzień od niedzieli."
              tr: "Japon takvimleri haftaya genellikle pazar günüyle başlar."
              id: "Kalender Jepang biasanya memulai pekan dari hari Minggu."
              vi: "Lịch Nhật thường bắt đầu tuần từ chủ nhật."
          - type: "rule"
            level: "A0"
            text:
              en: ["Ask the day with ", { term: "なんようび" }, ", and answer with the day and ", { term: "です" }, "."]
              uk: ["Про день запитують ", { term: "なんようび" }, ", а відповідають назвою дня з ", { term: "です" }, "."]
              es: ["El día se pregunta con ", { term: "なんようび" }, " y se responde con el día y ", { term: "です" }, "."]
              pt: ["O dia se pergunta com ", { term: "なんようび" }, " e se responde com o dia e ", { term: "です" }, "."]
              fr: ["On demande le jour avec ", { term: "なんようび" }, " et l’on répond par le jour suivi de ", { term: "です" }, "."]
              de: ["Den Tag erfragt man mit ", { term: "なんようび" }, " und antwortet mit dem Tag und ", { term: "です" }, "."]
              it: ["Il giorno si chiede con ", { term: "なんようび" }, " e si risponde con il giorno e ", { term: "です" }, "."]
              pl: ["O dzień pyta się słowem ", { term: "なんようび" }, ", a odpowiada nazwą dnia z ", { term: "です" }, "."]
              tr: ["Gün ", { term: "なんようび" }, " ile sorulur; gün adı ve ", { term: "です" }, " ile cevaplanır."]
              id: ["Hari ditanyakan dengan ", { term: "なんようび" }, " dan dijawab dengan nama hari dan ", { term: "です" }, "."]
              vi: ["Hỏi thứ bằng ", { term: "なんようび" }, " và trả lời bằng tên thứ cùng ", { term: "です" }, "."]
            ex: { exchange: [["きょうは", { target: "なんようび" }, "ですか。"], ["きょうは", { weekday: "すいようび", value: 3 }, "です。"]] }
            tr: { en: { exchange: ["What day is it today?", "Today is Wednesday."] }, uk: { exchange: ["Який сьогодні день тижня?", "Сьогодні середа."] }, es: { exchange: ["¿Qué día es hoy?", "Hoy es miércoles."] }, pt: { exchange: ["Que dia é hoje?", "Hoje é quarta-feira."] }, fr: { exchange: ["Quel jour sommes-nous aujourd’hui ?", "Aujourd’hui, c’est mercredi."] }, de: { exchange: ["Welcher Tag ist heute?", "Heute ist Mittwoch."] }, it: { exchange: ["Che giorno è oggi?", "Oggi è mercoledì."] }, pl: { exchange: ["Jaki jest dzisiaj dzień?", "Dzisiaj jest środa."] }, tr: { exchange: ["Bugün günlerden ne?", "Bugün çarşamba."] }, id: { exchange: ["Hari ini hari apa?", "Hari ini hari Rabu."] }, vi: { exchange: ["Hôm nay là thứ mấy?", "Hôm nay là thứ tư."] } }
          - type: "rule"
            level: "A1"
            text:
              en: ["Written, a day is its kanji plus ", { term: { kanji: "曜日", reading: "ようび" } }, "; the kanji name the sun, the moon and five elements."]
              uk: ["На письмі день — це його кандзі плюс ", { term: { kanji: "曜日", reading: "ようび" } }, "; кандзі означають сонце, місяць і п’ять стихій."]
              es: ["Por escrito, el día es su kanji más ", { term: { kanji: "曜日", reading: "ようび" } }, "; los kanji nombran el sol, la luna y cinco elementos."]
              pt: ["Por escrito, o dia é o seu kanji mais ", { term: { kanji: "曜日", reading: "ようび" } }, "; os kanji nomeiam o sol, a lua e cinco elementos."]
              fr: ["À l’écrit, le jour est son kanji suivi de ", { term: { kanji: "曜日", reading: "ようび" } }, " ; les kanji nomment le soleil, la lune et cinq éléments."]
              de: ["Geschrieben ist der Tag sein Kanji plus ", { term: { kanji: "曜日", reading: "ようび" } }, "; die Kanji nennen die Sonne, den Mond und fünf Elemente."]
              it: ["Per iscritto il giorno è il suo kanji più ", { term: { kanji: "曜日", reading: "ようび" } }, "; i kanji indicano il sole, la luna e cinque elementi."]
              pl: ["W piśmie dzień to jego kanji plus ", { term: { kanji: "曜日", reading: "ようび" } }, "; kanji nazywają słońce, księżyc i pięć żywiołów."]
              tr: ["Yazıda gün, kanjisi ile ", { term: { kanji: "曜日", reading: "ようび" } }, " sözcüğünden oluşur; kanjiler güneşi, ayı ve beş öğeyi adlandırır."]
              id: ["Dalam tulisan, hari adalah kanjinya ditambah ", { term: { kanji: "曜日", reading: "ようび" } }, "; kanji itu menamai matahari, bulan, dan lima unsur."]
              vi: ["Khi viết, thứ là chữ kanji của nó cộng với ", { term: { kanji: "曜日", reading: "ようび" } }, "; các chữ kanji gọi tên mặt trời, mặt trăng và năm yếu tố."]
            ex: { examples: [{ weekday: { target: { kanji: "月曜日", reading: "げつようび" } }, value: 1 }, { weekday: { target: { kanji: "金曜日", reading: "きんようび" } }, value: 5 }] }
            tr: { en: { examples: ["Monday", "Friday"] }, uk: { examples: ["понеділок", "п’ятниця"] }, es: { examples: ["lunes", "viernes"] }, pt: { examples: ["segunda-feira", "sexta-feira"] }, fr: { examples: ["lundi", "vendredi"] }, de: { examples: ["Montag", "Freitag"] }, it: { examples: ["lunedì", "venerdì"] }, pl: { examples: ["poniedziałek", "piątek"] }, tr: { examples: ["pazartesi", "cuma"] }, id: { examples: ["Senin", "Jumat"] }, vi: { examples: ["thứ hai", "thứ sáu"] } }
      - type: "usage"
        columns:
          - { key: "kanji", label: { en: "Kanji", uk: "Кандзі", es: "Kanji", pt: "Kanji", fr: "Kanji", de: "Kanji", it: "Kanji", pl: "Kanji", tr: "Kanji", id: "Kanji", vi: "Kanji" } }
          - { key: "day", label: { en: "Day", uk: "День", es: "Día", pt: "Dia", fr: "Jour", de: "Tag", it: "Giorno", pl: "Dzień", tr: "Gün", id: "Hari", vi: "Thứ" } }
        rows:
          - level: "A1"
            kanji: { term: { kanji: "日", reading: "にち" } }
            day: { weekday: { kanji: "日曜日", reading: "にちようび" }, value: 7 }
            tr: { en: "Sunday (sun)", uk: "неділя (сонце)", es: "domingo (sol)", pt: "domingo (sol)", fr: "dimanche (soleil)", de: "Sonntag (Sonne)", it: "domenica (sole)", pl: "niedziela (słońce)", tr: "pazar (güneş)", id: "Minggu (matahari)", vi: "chủ nhật (mặt trời)" }
          - level: "A1"
            kanji: { term: { kanji: "月", reading: "げつ" } }
            day: { weekday: { kanji: "月曜日", reading: "げつようび" }, value: 1 }
            tr: { en: "Monday (moon)", uk: "понеділок (місяць)", es: "lunes (luna)", pt: "segunda-feira (lua)", fr: "lundi (lune)", de: "Montag (Mond)", it: "lunedì (luna)", pl: "poniedziałek (księżyc)", tr: "pazartesi (ay)", id: "Senin (bulan)", vi: "thứ hai (mặt trăng)" }
          - level: "A1"
            kanji: { term: { kanji: "火", reading: "か" } }
            day: { weekday: { kanji: "火曜日", reading: "かようび" }, value: 2 }
            tr: { en: "Tuesday (fire)", uk: "вівторок (вогонь)", es: "martes (fuego)", pt: "terça-feira (fogo)", fr: "mardi (feu)", de: "Dienstag (Feuer)", it: "martedì (fuoco)", pl: "wtorek (ogień)", tr: "salı (ateş)", id: "Selasa (api)", vi: "thứ ba (lửa)" }
