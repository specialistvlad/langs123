            text:
              en: ["In writing they are ", { term: { kanji: "今日", reading: "きょう" } }, ", ", { term: { kanji: "明日", reading: "あした" } }, " and ", { term: { kanji: "昨日", reading: "きのう" } }, ". The past of ", { term: "です" }, " is ", { term: "でした" }, ": ", { link: "です: Am, Is, Are", to: "ja.sentence-basics.desu" }, "."]
              uk: ["На письмі це ", { term: { kanji: "今日", reading: "きょう" } }, ", ", { term: { kanji: "明日", reading: "あした" } }, " і ", { term: { kanji: "昨日", reading: "きのう" } }, ". Минулий час ", { term: "です" }, " — ", { term: "でした" }, ": ", { link: "です: бути", to: "ja.sentence-basics.desu" }, "."]
              es: ["Por escrito son ", { term: { kanji: "今日", reading: "きょう" } }, ", ", { term: { kanji: "明日", reading: "あした" } }, " y ", { term: { kanji: "昨日", reading: "きのう" } }, ". El pasado de ", { term: "です" }, " es ", { term: "でした" }, ": ", { link: "です: ser", to: "ja.sentence-basics.desu" }, "."]
