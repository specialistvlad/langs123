          tr: { en: "April", uk: "квітень", es: "abril", pt: "abril", fr: "avril", de: "April", it: "aprile", pl: "kwiecień", tr: "nisan", id: "April", vi: "tháng tư" }
        - level: "A1"
          point: { en: "Trap", uk: "Пастка", es: "Trampa", pt: "Armadilha", fr: "Piège", de: "Falle", it: "Trappola", pl: "Pułapka", tr: "Tuzak", id: "Jebakan", vi: "Bẫy" }
          rule:
            en: ["the 1st is ", { term: "ついたち" }, ", the 20th ", { term: "はつか" }]
            uk: ["1-ше — ", { term: "ついたち" }, ", 20-те — ", { term: "はつか" }]
