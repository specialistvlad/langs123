              pt: ["Os sons sonoros, os kana pequenos e as vogais longas vêm em ", { link: "Os sons do kana", to: "ja.foundations.kana-sounds" }, "."]
              fr: ["Les sons voisés, les petits kana et les voyelles longues suivent dans ", { link: "Les sons du kana", to: "ja.foundations.kana-sounds" }, "."]
              de: ["Stimmhafte Laute, kleine Kana und lange Vokale folgen in ", { link: "Die Laute der Kana", to: "ja.foundations.kana-sounds" }, "."]
              it: ["I suoni sonori, i kana piccoli e le vocali lunghe seguono in ", { link: "I suoni del kana", to: "ja.foundations.kana-sounds" }, "."]
              pl: ["Dźwięki dźwięczne, małe kana i długie samogłoski opisuje ", { link: "Dźwięki kany", to: "ja.foundations.kana-sounds" }, "."]
              tr: ["Ötümlü sesler, küçük kanalar ve uzun ünlüler ", { link: "Kana sesleri", to: "ja.foundations.kana-sounds" }, " konusunda gelir."]
              id: ["Bunyi bersuara, kana kecil, dan vokal panjang dibahas di ", { link: "Bunyi kana", to: "ja.foundations.kana-sounds" }, "."]
              vi: ["Âm hữu thanh, kana nhỏ và nguyên âm dài nằm ở ", { link: "Âm của kana", to: "ja.foundations.kana-sounds" }, "."]
