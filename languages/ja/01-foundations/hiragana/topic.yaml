summary:
  lead:
    en: "The 46 basic hiragana, one sound each, set out in a table of five vowels and ten rows."
    uk: "Основні кани хірагани, 46 знаків по одному звуку, у таблиці з п’яти голосних і десяти рядів."
    es: "Los 46 hiragana básicos, cada uno con un sonido, en una tabla de cinco vocales y diez filas."
    pt: "Os 46 hiragana básicos, cada um com um som, numa tabela de cinco vogais e dez linhas."
    fr: "Les 46 hiragana de base, un son chacun, rangés dans un tableau de cinq voyelles et dix rangées."
    de: "Die 46 Grund-Hiragana, je ein Laut, geordnet in einer Tabelle mit fünf Vokalen und zehn Reihen."
    it: "I 46 hiragana di base, un suono ciascuno, in una tabella di cinque vocali e dieci righe."
    pl: "Podstawowe znaki hiragana, po jednym dźwięku na każdy z 46, w tabeli z pięcioma samogłoskami i dziesięcioma rzędami."
    tr: "Her biri tek bir sesi gösteren 46 temel hiragana, beş ünlü ve on sıradan oluşan bir tabloda."
    id: "Hiragana dasar, 46 kana dengan satu bunyi masing-masing, tersusun dalam tabel lima vokal dan sepuluh baris."
    vi: "Bảng hiragana cơ bản gồm 46 chữ, mỗi chữ một âm, xếp thành năm nguyên âm và mười hàng."
  rule:
    en: ["As particles, ", { term: "は" }, ", ", { term: "へ" }, " and ", { term: "を" }, " read ", { sound: "wa" }, ", ", { sound: "e" }, " and ", { sound: "o" }, ":"]
    uk: ["Як частки, ", { term: "は" }, ", ", { term: "へ" }, " і ", { term: "を" }, " читаються ", { sound: "wa" }, ", ", { sound: "e" }, " і ", { sound: "o" }, ":"]
    es: ["Como partículas, ", { term: "は" }, ", ", { term: "へ" }, " y ", { term: "を" }, " se leen ", { sound: "wa" }, ", ", { sound: "e" }, " y ", { sound: "o" }, ":"]
    pt: ["Como partículas, ", { term: "は" }, ", ", { term: "へ" }, " e ", { term: "を" }, " se leem ", { sound: "wa" }, ", ", { sound: "e" }, " e ", { sound: "o" }, ":"]
    fr: ["Comme particules, ", { term: "は" }, ", ", { term: "へ" }, " et ", { term: "を" }, " se lisent ", { sound: "wa" }, ", ", { sound: "e" }, " et ", { sound: "o" }, " :"]
    de: ["Als Partikeln werden ", { term: "は" }, ", ", { term: "へ" }, " und ", { term: "を" }, " ", { sound: "wa" }, ", ", { sound: "e" }, " und ", { sound: "o" }, " gelesen:"]
    it: ["Come particelle, ", { term: "は" }, ", ", { term: "へ" }, " e ", { term: "を" }, " si leggono ", { sound: "wa" }, ", ", { sound: "e" }, " e ", { sound: "o" }, ":"]
    pl: ["Jako partykuły ", { term: "は" }, ", ", { term: "へ" }, " i ", { term: "を" }, " czyta się ", { sound: "wa" }, ", ", { sound: "e" }, " i ", { sound: "o" }, ":"]
    tr: ["Edat olarak ", { term: "は" }, ", ", { term: "へ" }, " ve ", { term: "を" }, " ", { sound: "wa" }, ", ", { sound: "e" }, " ve ", { sound: "o" }, " diye okunur:"]
    id: ["Sebagai partikel, ", { term: "は" }, ", ", { term: "へ" }, ", dan ", { term: "を" }, " dibaca ", { sound: "wa" }, ", ", { sound: "e" }, ", dan ", { sound: "o" }, ":"]
    vi: ["Khi làm trợ từ, ", { term: "は" }, ", ", { term: "へ" }, " và ", { term: "を" }, " đọc là ", { sound: "wa" }, ", ", { sound: "e" }, " và ", { sound: "o" }, ":"]
