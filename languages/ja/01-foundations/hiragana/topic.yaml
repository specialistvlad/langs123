              uk: "Слова йдуть одне за одним без пробілів."
              es: "Las palabras se siguen sin espacios."
              pt: "As palavras se seguem sem espaços."
              fr: "Les mots se suivent sans espaces."
              de: "Wörter folgen ohne Leerzeichen aufeinander."
              it: "Le parole si susseguono senza spazi."
              pl: "Wyrazy następują po sobie bez spacji."
              tr: "Sözcükler boşluksuz art arda gelir."
              id: "Kata-kata berurutan tanpa spasi."
              vi: "Các từ nối liền nhau, không có dấu cách."
