            text:
              en: "Horizontal text runs left to right, line after line."
              uk: "Горизонтальний текст іде зліва направо, рядок за рядком."
              es: "El texto horizontal va de izquierda a derecha, línea tras línea."
              pt: "O texto horizontal vai da esquerda para a direita, linha após linha."
              fr: "Le texte horizontal va de gauche à droite, ligne après ligne."
              de: "Waagerechter Text läuft von links nach rechts, Zeile für Zeile."
              it: "Il testo orizzontale va da sinistra a destra, riga dopo riga."
              pl: "Tekst poziomy biegnie od lewej do prawej, wiersz po wierszu."
              tr: "Yatay metin soldan sağa, satır satır ilerler."
              id: "Teks mendatar berjalan dari kiri ke kanan, baris demi baris."
              vi: "Văn bản ngang chạy từ trái sang phải, hết dòng này đến dòng khác."
          - type: "rule"
            level: "A0"
            text:
              en: "Vertical text runs top to bottom, and its columns run from right to left; books and newspapers use it."
              uk: "Вертикальний текст іде згори вниз, а його стовпці — справа наліво; так друкують книжки й газети."
              es: "El texto vertical va de arriba abajo, y sus columnas de derecha a izquierda; lo usan libros y periódicos."
              pt: "O texto vertical vai de cima para baixo, e suas colunas da direita para a esquerda; livros e jornais o usam."
              fr: "Le texte vertical va de haut en bas, et ses colonnes de droite à gauche ; livres et journaux l’emploient."
              de: "Senkrechter Text läuft von oben nach unten, seine Spalten von rechts nach links; Bücher und Zeitungen nutzen ihn."
              it: "Il testo verticale va dall'alto in basso, e le sue colonne da destra a sinistra; lo usano libri e giornali."
              pl: "Tekst pionowy biegnie z góry na dół, a jego kolumny od prawej do lewej; używają go książki i gazety."
              tr: "Dikey metin yukarıdan aşağıya, sütunları sağdan sola ilerler; kitaplar ve gazeteler bunu kullanır."
              id: "Teks vertikal berjalan dari atas ke bawah, dan kolomnya dari kanan ke kiri; buku dan koran memakainya."
              vi: "Văn bản dọc chạy từ trên xuống, các cột chạy từ phải sang trái; sách và báo dùng cách này."
          - type: "rule"
            level: "A0"
            text:
