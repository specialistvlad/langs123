sections:
  - title:
      en: "Hiragana and the table"
      uk: "Хірагана й таблиця"
      es: "El hiragana y la tabla"
      pt: "O hiragana e a tabela"
      fr: "Les hiragana et le tableau"
      de: "Hiragana und die Tabelle"
      it: "L'hiragana e la tabella"
      pl: "Hiragana i tabela"
      tr: "Hiragana ve tablo"
      id: "Hiragana dan tabelnya"
      vi: "Hiragana và bảng chữ"
    role: "own"
    content:
      - type: "list"
        items:
          - type: "rule"
            level: "A0"
            text:
              en: "Hiragana has 46 basic kana, and each kana stands for one sound."
              uk: "Хірагана має 46 основних кан, і кожна кана позначає один звук."
              es: "El hiragana tiene 46 kana básicos, y cada kana representa un sonido."
              pt: "O hiragana tem 46 kana básicos, e cada kana representa um som."
              fr: "L’hiragana compte 46 kana de base, et chaque kana note un son."
              de: "Das Hiragana hat 46 Grund-Kana, und jedes Kana steht für einen Laut."
              it: "L'hiragana ha 46 kana di base, e ogni kana rappresenta un suono."
              pl: "Hiragana ma 46 podstawowych znaków kana, a każdy oznacza jeden dźwięk."
              tr: "Hiraganada 46 temel kana vardır ve her kana tek bir sesi gösterir."
              id: "Hiragana punya 46 kana dasar, dan setiap kana mewakili satu bunyi."
              vi: "Hiragana có 46 kana cơ bản, và mỗi kana biểu thị một âm."
          - type: "rule"
            level: "A0"
            text:
              en: ["Hiragana writes endings, particles and many native words; ", { link: "Katakana", to: "ja.foundations.katakana" }, " and ", { link: "Kanji", to: "ja.foundations.kanji" }, " write the rest."]
              uk: ["Хірагана пише закінчення, частки й багато рідних слів; решту пишуть ", { link: "Катакана", to: "ja.foundations.katakana" }, " і ", { link: "Кандзі", to: "ja.foundations.kanji" }, "."]
              es: ["El hiragana escribe terminaciones, partículas y muchas palabras japonesas; ", { link: "Katakana", to: "ja.foundations.katakana" }, " y ", { link: "Kanji", to: "ja.foundations.kanji" }, " escriben el resto."]
              pt: ["O hiragana escreve terminações, partículas e muitas palavras japonesas; ", { link: "Katakana", to: "ja.foundations.katakana" }, " e ", { link: "Kanji", to: "ja.foundations.kanji" }, " escrevem o resto."]
              fr: ["L’hiragana note les terminaisons, les particules et beaucoup de mots japonais ; ", { link: "Katakana", to: "ja.foundations.katakana" }, " et ", { link: "Kanji", to: "ja.foundations.kanji" }, " notent le reste."]
              de: ["Das Hiragana schreibt Endungen, Partikeln und viele japanische Wörter; ", { link: "Katakana", to: "ja.foundations.katakana" }, " und ", { link: "Kanji", to: "ja.foundations.kanji" }, " schreiben den Rest."]
              it: ["L'hiragana scrive desinenze, particelle e molte parole giapponesi; ", { link: "Katakana", to: "ja.foundations.katakana" }, " e ", { link: "Kanji", to: "ja.foundations.kanji" }, " scrivono il resto."]
              pl: ["Hiragana zapisuje końcówki, partykuły i wiele rodzimych słów; resztę zapisują ", { link: "Katakana", to: "ja.foundations.katakana" }, " i ", { link: "Kanji", to: "ja.foundations.kanji" }, "."]
              tr: ["Hiragana ekleri, edatları ve birçok Japonca sözcüğü yazar; gerisini ", { link: "Katakana", to: "ja.foundations.katakana" }, " ve ", { link: "Kanji", to: "ja.foundations.kanji" }, " yazar."]
              id: ["Hiragana menulis akhiran, partikel, dan banyak kata asli Jepang; sisanya ditulis dengan ", { link: "Katakana", to: "ja.foundations.katakana" }, " dan ", { link: "Kanji", to: "ja.foundations.kanji" }, "."]
              vi: ["Hiragana viết đuôi từ, trợ từ và nhiều từ gốc Nhật; ", { link: "Katakana", to: "ja.foundations.katakana" }, " và ", { link: "Kanji (Hán tự)", to: ja.foundations.kanji }, " viết phần còn lại."]
          - type: "rule"
            level: "A0"
            text:
              en: ["The table is called ", { term: "ごじゅうおん" }, "; it has five vowels across and ten rows down."]
              uk: ["Таблиця називається ", { term: "ごじゅうおん" }, "; у ній п’ять голосних по горизонталі й десять рядів по вертикалі."]
              es: ["La tabla se llama ", { term: "ごじゅうおん" }, "; tiene cinco vocales a lo ancho y diez filas hacia abajo."]
              pt: ["A tabela se chama ", { term: "ごじゅうおん" }, "; tem cinco vogais na horizontal e dez linhas na vertical."]
              fr: ["Le tableau s’appelle ", { term: "ごじゅうおん" }, " ; il compte cinq voyelles en largeur et dix rangées en hauteur."]
              de: ["Die Tabelle heißt ", { term: "ごじゅうおん" }, "; sie hat fünf Vokale quer und zehn Reihen nach unten."]
              it: ["La tabella si chiama ", { term: "ごじゅうおん" }, "; ha cinque vocali in orizzontale e dieci righe in verticale."]
              pl: ["Tabela nazywa się ", { term: "ごじゅうおん" }, "; ma pięć samogłosek w poziomie i dziesięć rzędów w pionie."]
              tr: ["Tabloya ", { term: "ごじゅうおん" }, " denir; yatay beş ünlü ve dikey on sıra içerir."]
              id: ["Tabel ini disebut ", { term: "ごじゅうおん" }, "; isinya lima vokal ke samping dan sepuluh baris ke bawah."]
              vi: ["Bảng này gọi là ", { term: "ごじゅうおん" }, "; có năm nguyên âm theo hàng ngang và mười hàng theo cột dọc."]
          - type: "rule"
            level: "A0"
            text:
              en: "A row keeps its consonant and runs through the vowels in the fixed order a, i, u, e, o."
              uk: "Ряд зберігає свою приголосну й проходить голосні в сталому порядку a, i, u, e, o."
              es: "Cada fila conserva su consonante y recorre las vocales en el orden fijo a, i, u, e, o."
              pt: "Cada linha mantém a sua consoante e percorre as vogais na ordem fixa a, i, u, e, o."
              fr: "Chaque rangée garde sa consonne et parcourt les voyelles dans l’ordre fixe a, i, u, e, o."
              de: "Jede Reihe behält ihren Konsonanten und durchläuft die Vokale in der festen Folge a, i, u, e, o."
              it: "Ogni riga mantiene la sua consonante e percorre le vocali nell'ordine fisso a, i, u, e, o."
              pl: "Rząd zachowuje swoją spółgłoskę i przechodzi przez samogłoski w stałej kolejności a, i, u, e, o."
              tr: "Her sıra kendi ünsüzünü korur ve ünlüleri sabit a, i, u, e, o sırasıyla dolaşır."
              id: "Setiap baris mempertahankan konsonannya dan melewati vokal dalam urutan tetap a, i, u, e, o."
              vi: "Mỗi hàng giữ phụ âm của mình và đi qua các nguyên âm theo thứ tự cố định a, i, u, e, o."
            ex: [{ alternatives: [{ target: "か" }, { target: "き" }, { target: "く" }, { target: "け" }, { target: "こ" }] }, " ", { sound: "ka, ki, ku, ke, ko" }]
          - type: "rule"
            level: "A0"
            text:
              en: ["Romaji spells Japanese in Latin letters; this guide uses modified Hepburn, which writes ", { term: "し" }, " as ", { sound: "shi" }, "."]
              uk: ["Ромадзі передає японську латиницею; цей посібник вживає модифіковану систему Хепберна, що пише ", { term: "し" }, " як ", { sound: "shi" }, "."]
              es: ["El rōmaji escribe el japonés con letras latinas; esta guía usa el Hepburn modificado, que escribe ", { term: "し" }, " como ", { sound: "shi" }, "."]
              pt: ["O rōmaji escreve o japonês com letras latinas; este guia usa o Hepburn modificado, que escreve ", { term: "し" }, " como ", { sound: "shi" }, "."]
              fr: ["Le rōmaji note le japonais en lettres latines ; ce guide suit le Hepburn modifié, qui écrit ", { term: "し" }, " ", { sound: "shi" }, "."]
              de: ["Rōmaji schreibt Japanisch mit lateinischen Buchstaben; dieser Leitfaden folgt dem modifizierten Hepburn, das ", { term: "し" }, " als ", { sound: "shi" }, " schreibt."]
              it: ["Il rōmaji scrive il giapponese con lettere latine; questa guida usa l'Hepburn modificato, che scrive ", { term: "し" }, " come ", { sound: "shi" }, "."]
              pl: ["Rōmaji zapisuje japoński literami łacińskimi; ten przewodnik używa zmodyfikowanego systemu Hepburna, który pisze ", { term: "し" }, " jako ", { sound: "shi" }, "."]
              tr: ["Romaji, Japoncayı Latin harfleriyle yazar; bu rehber ", { term: "し" }, " harfini ", { sound: "shi" }, " diye yazan değiştirilmiş Hepburn sistemini kullanır."]
              id: ["Rōmaji menulis bahasa Jepang dengan huruf Latin; panduan ini memakai Hepburn yang dimodifikasi, yang menulis ", { term: "し" }, " sebagai ", { sound: "shi" }, "."]
              vi: ["Rōmaji viết tiếng Nhật bằng chữ Latinh; hướng dẫn này dùng hệ Hepburn cải biên, viết ", { term: "し" }, " là ", { sound: "shi" }, "."]
          - type: "rule"
            level: "A0"
            text:
              en: ["Voiced sounds, small kana and long vowels follow in ", { link: "Kana Sounds", to: ja.foundations.kana-sounds }, "."]
              uk: ["Дзвінкі звуки, малі кани й довгі голосні — у розділі ", { link: "Звуки кани", to: "ja.foundations.kana-sounds" }, "."]
