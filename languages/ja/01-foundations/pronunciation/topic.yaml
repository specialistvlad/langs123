summary:
  lead:
    en: ["Japanese has five pure vowels, equal beats, a tapped r, whispered vowels in ", { term: "です" }, " and ", { term: "ます" }, ", and pitch accent in place of stress."]
    uk: ["Японська має п’ять чистих голосних, рівні мори, одноударний р, голосні пошепки в ", { term: "です" }, " і ", { term: "ます" }, " та тональний наголос."]
    es: ["El japonés tiene cinco vocales puras, moras iguales, una r simple, vocales susurradas en ", { term: "です" }, " y ", { term: "ます" }, " y acento tonal."]
    pt: ["O japonês tem cinco vogais puras, moras iguais, um r de uma batida, vogais sussurradas em ", { term: "です" }, " e ", { term: "ます" }, " e acento tonal."]
    fr: ["Le japonais a cinq voyelles pures, des mores égales, un r battu, des voyelles chuchotées dans ", { term: "です" }, " et ", { term: "ます" }, " et un accent de hauteur."]
    de: ["Das Japanische hat fünf reine Vokale, gleiche Moren, ein Zungenspitzen-R, geflüsterte Vokale in ", { term: "です" }, " und ", { term: "ます" }, " und Tonhöhenakzent."]
    it: ["Il giapponese ha cinque vocali pure, more uguali, una r battuta, vocali sussurrate in ", { term: "です" }, " e ", { term: "ます" }, " e un accento tonale."]
    pl: ["Japoński ma pięć czystych samogłosek, równe mory, r jednouderzeniowe, szeptane samogłoski w ", { term: "です" }, " i ", { term: "ます" }, " oraz akcent tonalny."]
    tr: ["Japoncada beş saf ünlü, eşit mora, tek vuruşlu r, ", { term: "です" }, " ve ", { term: "ます" }, "'ta fısıltılı ünlüler ve perde vurgusu vardır."]
    id: ["Bahasa Jepang punya lima vokal murni, mora yang sama, r sentuh, vokal berbisik pada ", { term: "です" }, " dan ", { term: "ます" }, ", serta aksen nada."]
    vi: ["Tiếng Nhật có năm nguyên âm thuần, các mora đều nhau, âm r chạm lưỡi, nguyên âm thì thầm trong ", { term: "です" }, " và ", { term: "ます" }, ", và trọng âm cao độ."]
  rule:
    en: "Say every kana as one beat of the same length, with a short, pure vowel:"
    uk: "Вимовляйте кожну кану як одну мору однакової довжини з коротким чистим голосним:"
    es: "Pronuncia cada kana como una mora de igual duración, con una vocal corta y pura:"
    pt: "Pronuncie cada kana como uma mora de igual duração, com uma vogal curta e pura:"
    fr: "Prononcez chaque kana comme une more de même durée, avec une voyelle brève et pure :"
    de: "Sprich jedes Kana als eine gleich lange Mora mit einem kurzen, reinen Vokal:"
    it: "Pronuncia ogni kana come una mora di uguale durata, con una vocale breve e pura:"
    pl: "Wymawiaj każdą kanę jako jedną morę równej długości, z krótką, czystą samogłoską:"
    tr: "Her kanayı aynı uzunlukta tek bir mora olarak, kısa ve saf bir ünlüyle söyleyin:"
    id: "Ucapkan setiap kana sebagai satu mora yang sama panjang, dengan vokal pendek dan murni:"
    vi: "Đọc mỗi kana là một mora dài bằng nhau, với nguyên âm ngắn và thuần:"
  ex: { target: "さ・く・ら" }
