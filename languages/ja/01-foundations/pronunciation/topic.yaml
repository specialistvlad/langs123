      - type: "list"
        items:
          - type: "rule"
            level: "A1"
            text:
              en: "A devoiced vowel is whispered: the mouth shapes it, but the voice does not sound."
              uk: "Оглушений голосний вимовляється пошепки: рот приймає його форму, але голос не звучить."
              es: "Una vocal ensordecida se susurra: la boca le da forma, pero la voz no suena."
              pt: "Uma vogal desvozeada é sussurrada: a boca lhe dá forma, mas a voz não soa."
              fr: "Une voyelle dévoisée est chuchotée : la bouche la forme, mais la voix ne sonne pas."
              de: "Ein stimmloser Vokal wird geflüstert: Der Mund formt ihn, aber die Stimme setzt aus."
              it: "Una vocale desonorizzata è sussurrata: la bocca la forma, ma la voce non suona."
              pl: "Samogłoskę ogłuszoną wymawia się szeptem: usta nadają jej kształt, ale głos milknie."
              tr: "Ötümsüzleşen ünlü fısıltıyla söylenir: ağız ona biçim verir ama ses titreşmez."
              id: "Vokal tak bersuara diucapkan berbisik: mulut membentuknya, tetapi suara tidak berbunyi."
              vi: "Nguyên âm vô thanh được đọc thì thầm: miệng tạo hình nó nhưng thanh không rung."
          - type: "note"
            level: "A1"
            text:
              en: ["A whispered vowel keeps its beat: ", { term: "です" }, " still has two."]
              uk: ["Вимовлений пошепки голосний зберігає свою мору: у ", { term: "です" }, " їх досі дві."]
              es: ["Una vocal susurrada conserva su mora: ", { term: "です" }, " sigue teniendo dos."]
              pt: ["Uma vogal sussurrada conserva sua mora: ", { term: "です" }, " continua com duas."]
              fr: ["Une voyelle chuchotée garde sa more : ", { term: "です" }, " en compte toujours deux."]
              de: ["Ein geflüsterter Vokal behält seine Mora: ", { term: "です" }, " hat weiterhin zwei."]
              it: ["Una vocale sussurrata conserva la sua mora: ", { term: "です" }, " ne ha ancora due."]
              pl: ["Samogłoska wymawiana szeptem zachowuje swoją morę: ", { term: "です" }, " nadal ma dwie."]
              tr: ["Fısıltıyla söylenen ünlü morasını korur: ", { term: "です" }, " yine iki moradır."]
              id: ["Vokal yang dibisikkan tetap mempertahankan moranya: ", { term: "です" }, " masih punya dua."]
              vi: ["Nguyên âm thì thầm vẫn giữ mora của nó: ", { term: "です" }, " vẫn có hai mora."]
