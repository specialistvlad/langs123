              uk: ["Зміна відбувається сама: ", { term: "ん" }, " підлаштовується під наступний звук і триває рівно одну мору."]
              es: ["El cambio es automático: ", { term: "ん" }, " sigue al sonido siguiente y dura siempre una mora."]
              pt: ["A mudança é automática: ", { term: "ん" }, " acompanha o som seguinte e dura sempre uma mora."]
              fr: ["Le changement est automatique : ", { term: "ん" }, " suit le son suivant et dure toujours une more."]
              de: ["Der Wechsel geschieht von selbst: ", { term: "ん" }, " folgt dem nächsten Laut und dauert immer eine Mora."]
              it: ["Il cambiamento è automatico: ", { term: "ん" }, " segue il suono successivo e dura sempre una mora."]
              pl: ["Zmiana zachodzi sama: ", { term: "ん" }, " dostosowuje się do następnej głoski i zawsze trwa jedną morę."]
              tr: ["Değişim kendiliğinden olur: ", { term: "ん" }, " sonraki sese uyar ve her zaman bir mora sürer."]
              id: ["Perubahan terjadi dengan sendirinya: ", { term: "ん" }, " mengikuti bunyi berikutnya dan selalu satu mora."]
              vi: ["Sự biến đổi diễn ra tự nhiên: ", { term: "ん" }, " theo âm sau và luôn dài một mora."]
  - title:
      en: "Pitch accent"
      uk: "Тональний наголос"
      es: "Acento tonal"
      pt: "Acento tonal"
      fr: "Accent de hauteur"
      de: "Tonhöhenakzent"
      it: "Accento tonale"
      pl: "Akcent tonalny"
      tr: "Perde vurgusu"
      id: "Aksen nada"
      vi: "Trọng âm cao độ"
    role: "own"
    content:
      - type: "list"
        items:
          - type: "rule"
            level: "A1"
            text:
              en: "Japanese marks words by pitch, high and low, not by a louder syllable."
              uk: "Японська розрізняє слова за висотою тону, високою й низькою, а не гучнішим складом."
              es: "El japonés distingue las palabras por el tono, alto y bajo, no por una sílaba más fuerte."
              pt: "O japonês distingue palavras pelo tom, alto e baixo, não por uma sílaba mais forte."
              fr: "Le japonais distingue les mots par la hauteur, haute ou basse, et non par une syllabe plus forte."
              de: "Das Japanische unterscheidet Wörter durch Tonhöhe, hoch und tief, nicht durch eine lautere Silbe."
              it: "Il giapponese distingue le parole con il tono, alto e basso, non con una sillaba più forte."
              pl: "Japoński odróżnia wyrazy wysokością tonu, wysoką i niską, a nie głośniejszą sylabą."
              tr: "Japonca sözcükleri yüksek ve alçak perdeyle ayırır, daha güçlü bir heceyle değil."
              id: "Bahasa Jepang membedakan kata dengan nada, tinggi dan rendah, bukan dengan suku kata yang lebih keras."
              vi: "Tiếng Nhật phân biệt từ bằng cao độ, cao và thấp, không phải bằng âm tiết đọc to hơn."
          - type: "rule"
            level: "A1"
            text:
              en: "The first two beats differ: if the first is low, the second is high, and the reverse."
              uk: "Перші дві мори різні: якщо перша низька, друга висока, і навпаки."
              es: "Las dos primeras moras difieren: si la primera es baja, la segunda es alta, y al revés."
              pt: "As duas primeiras moras diferem: se a primeira é baixa, a segunda é alta, e vice-versa."
              fr: "Les deux premières mores diffèrent : si la première est basse, la seconde est haute, et inversement."
              de: "Die ersten zwei Moren unterscheiden sich: Ist die erste tief, ist die zweite hoch, und umgekehrt."
              it: "Le prime due more differiscono: se la prima è bassa, la seconda è alta, e viceversa."
              pl: "Pierwsze dwie mory się różnią: jeśli pierwsza jest niska, druga jest wysoka, i odwrotnie."
              tr: "İlk iki mora birbirinden farklıdır: ilki alçaksa ikincisi yüksektir, tersi de geçerlidir."
              id: "Dua mora pertama berbeda: jika yang pertama rendah, yang kedua tinggi, dan sebaliknya."
              vi: "Hai mora đầu khác nhau: nếu mora đầu thấp thì mora hai cao, và ngược lại."
          - type: "rule"
            level: "A1"
            text:
              en: "After the pitch falls, it does not rise again inside the word."
              uk: "Після спаду тон у слові вже не піднімається."
              es: "Tras bajar, el tono no vuelve a subir dentro de la palabra."
              pt: "Depois que o tom cai, ele não volta a subir dentro da palavra."
              fr: "Une fois la hauteur descendue, elle ne remonte plus dans le mot."
              de: "Nach dem Abfall steigt die Tonhöhe im Wort nicht wieder an."
              it: "Dopo la discesa, il tono non risale all’interno della parola."
              pl: "Po spadku wysokość tonu nie rośnie już w obrębie wyrazu."
              tr: "Perde bir kez düştükten sonra sözcük içinde yeniden yükselmez."
              id: "Setelah nada turun, ia tidak naik lagi di dalam kata."
              vi: "Sau khi cao độ hạ xuống, nó không lên lại trong từ."
          - type: "note"
            level: "A1"
            text:
              en: ["In the transcriptions, ", { ipa: "˥" }, " is high and ", { ipa: "˩" }, " is low; the pitch is that of Tokyo."]
              uk: ["У транскрипціях ", { ipa: "˥" }, " — високий тон, ", { ipa: "˩" }, " — низький; подано тон токійської норми."]
              es: ["En las transcripciones, ", { ipa: "˥" }, " es tono alto y ", { ipa: "˩" }, " bajo; es el tono de Tokio."]
              pt: ["Nas transcrições, ", { ipa: "˥" }, " é tom alto e ", { ipa: "˩" }, " baixo; é o tom de Tóquio."]
              fr: ["Dans les transcriptions, ", { ipa: "˥" }, " note le haut et ", { ipa: "˩" }, " le bas ; c’est la hauteur de Tokyo."]
              de: ["In den Transkriptionen steht ", { ipa: "˥" }, " für hoch und ", { ipa: "˩" }, " für tief; es ist die Tonhöhe von Tokio."]
              it: ["Nelle trascrizioni, ", { ipa: "˥" }, " indica il tono alto e ", { ipa: "˩" }, " il basso; è il tono di Tokyo."]
              pl: ["W transkrypcjach ", { ipa: "˥" }, " oznacza ton wysoki, a ", { ipa: "˩" }, " niski; to wymowa tokijska."]
              tr: ["Transkripsiyonlarda ", { ipa: "˥" }, " yüksek, ", { ipa: "˩" }, " alçak perdedir; perde Tokyo ağzınındır."]
              id: ["Dalam transkripsi, ", { ipa: "˥" }, " berarti nada tinggi dan ", { ipa: "˩" }, " rendah; nadanya adalah nada Tokyo."]
              vi: ["Trong phiên âm, ", { ipa: "˥" }, " là cao độ cao và ", { ipa: "˩" }, " là thấp; đó là cao độ của vùng Tokyo."]
