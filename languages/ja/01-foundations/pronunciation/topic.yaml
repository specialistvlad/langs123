          tr: { en: { examples: ["the bridge", "the edge"] }, uk: { examples: ["міст", "край"] }, es: { examples: ["el puente", "el borde"] }, pt: { examples: ["a ponte", "a beira"] }, fr: { examples: ["le pont", "le bord"] }, de: { examples: ["die Brücke", "der Rand"] }, it: { examples: ["il ponte", "il bordo"] }, pl: { examples: ["most", "brzeg"] }, tr: { examples: ["köprü", "kenar"] }, id: { examples: ["jembatan", "tepi"] }, vi: { examples: ["cây cầu", "mép"] } }
        - level: "A0"
          point: { en: "Trap", uk: "Пастка", es: "Trampa", pt: "Armadilha", fr: "Piège", de: "Falle", it: "Trappola", pl: "Pułapka", tr: "Tuzak", id: "Jebakan", vi: "Bẫy" }
          rule:
            en: "A long vowel lasts two beats; shortened, it names another word."
            uk: "Довгий голосний триває дві мори; скорочений, він дає інше слово."
            es: "Una vocal larga dura dos moras; acortada, nombra otra palabra."
            pt: "Uma vogal longa dura duas moras; encurtada, nomeia outra palavra."
            fr: "Une voyelle longue dure deux mores ; raccourcie, elle donne un autre mot."
            de: "Ein langer Vokal dauert zwei Moren; verkürzt ergibt er ein anderes Wort."
            it: "Una vocale lunga dura due more; accorciata, dà un’altra parola."
            pl: "Długa samogłoska trwa dwie mory; skrócona, daje inny wyraz."
            tr: "Uzun ünlü iki mora sürer; kısalırsa başka bir sözcük olur."
            id: "Vokal panjang berlangsung dua mora; jika dipendekkan, menjadi kata lain."
            vi: "Nguyên âm dài kéo dài hai mora; đọc ngắn sẽ thành từ khác."
          ex: { target: "おじいさん" }
          tr: { en: "grandfather", uk: "дідусь", es: "abuelo", pt: "avô", fr: "grand-père", de: "Großvater", it: "nonno", pl: "dziadek", tr: "dede", id: "kakek", vi: "ông" }
        - level: "A1"
          point: { en: "Trap", uk: "Пастка", es: "Trampa", pt: "Armadilha", fr: "Piège", de: "Falle", it: "Trappola", pl: "Pułapka", tr: "Tuzak", id: "Jebakan", vi: "Bẫy" }
          rule:
            en: ["No beat is louder: say ", { term: "さくら" }, " low, high, high."]
            uk: ["Жодна мора не гучніша: ", { term: "さくら" }, " — низько, високо, високо."]
            es: ["Ninguna mora es más fuerte: ", { term: "さくら" }, " es bajo, alto, alto."]
            pt: ["Nenhuma mora é mais forte: ", { term: "さくら" }, " é baixo, alto, alto."]
            fr: ["Aucune more n’est plus forte : ", { term: "さくら" }, " se dit bas, haut, haut."]
            de: ["Keine Mora ist lauter: ", { term: "さくら" }, " ist tief, hoch, hoch."]
            it: ["Nessuna mora è più forte: ", { term: "さくら" }, " è basso, alto, alto."]
            pl: ["Żadna mora nie jest głośniejsza: ", { term: "さくら" }, " to nisko, wysoko, wysoko."]
            tr: ["Hiçbir mora daha güçlü değildir: ", { term: "さくら" }, " alçak, yüksek, yüksek söylenir."]
            id: ["Tidak ada mora yang lebih keras: ", { term: "さくら" }, " rendah, tinggi, tinggi."]
            vi: ["Không mora nào to hơn: ", { term: "さくら" }, " đọc thấp, cao, cao."]
          ex: { target: "さくら" }
          tr: { en: "cherry blossom", uk: "вишневий цвіт", es: "flor de cerezo", pt: "flor de cerejeira", fr: "fleur de cerisier", de: "Kirschblüte", it: "fiore di ciliegio", pl: "kwiat wiśni", tr: "kiraz çiçeği", id: "bunga sakura", vi: "hoa anh đào" }
sections:
  - title:
      en: "The five vowels"
      uk: "П’ять голосних"
      es: "Las cinco vocales"
      pt: "As cinco vogais"
      fr: "Les cinq voyelles"
      de: "Die fünf Vokale"
      it: "Le cinque vocali"
      pl: "Pięć samogłosek"
      tr: "Beş ünlü"
      id: "Lima vokal"
      vi: "Năm nguyên âm"
    role: "own"
    content:
      - type: "inventory"
        set: "sounds"
        columns:
          - { key: "sound", label: { en: "Sound", uk: "Звук", es: "Sonido", pt: "Som", fr: "Son", de: "Laut", it: "Suono", pl: "Dźwięk", tr: "Ses", id: "Bunyi", vi: "Âm" } }
          - { key: "kana", label: { en: "Kana", uk: "Кана", es: "Kana", pt: "Kana", fr: "Kana", de: "Kana", it: "Kana", pl: "Kana", tr: "Kana", id: "Kana", vi: "Kana" } }
          - { key: "ex", label: { en: "Example", uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - level: "A0"
            value: "a"
            sound: { ipa: "a" }
            kana: { target: "あ" }
            ex: "あさ"
            tr: { en: "morning", uk: "ранок", es: "mañana", pt: "manhã", fr: "matin", de: "Morgen", it: "mattina", pl: "poranek", tr: "sabah", id: "pagi", vi: "buổi sáng" }
          - level: "A0"
            value: "i"
            sound: { ipa: "i" }
            kana: { target: "い" }
            ex: "いし"
            tr: { en: "stone", uk: "камінь", es: "piedra", pt: "pedra", fr: "pierre", de: "Stein", it: "sasso", pl: "kamień", tr: "taş", id: "batu", vi: "hòn đá" }
          - level: "A0"
            value: "ɯ"
            sound: { ipa: "ɯ" }
            kana: { target: "う" }
            ex: "うた"
            tr: { en: "song", uk: "пісня", es: "canción", pt: "canção", fr: "chanson", de: "Lied", it: "canzone", pl: "piosenka", tr: "şarkı", id: "lagu", vi: "bài hát" }
          - level: "A0"
            value: "e"
            sound: { ipa: "e" }
            kana: { target: "え" }
            ex: "えき"
            tr: { en: "station", uk: "станція", es: "estación", pt: "estação", fr: "gare", de: "Bahnhof", it: "stazione", pl: "stacja", tr: "istasyon", id: "stasiun", vi: "nhà ga" }
          - level: "A0"
            value: "o"
            sound: { ipa: "o" }
            kana: { target: "お" }
            ex: "おと"
            tr: { en: "sound", uk: "звук", es: "sonido", pt: "som", fr: "bruit", de: "Geräusch", it: "suono", pl: "dźwięk", tr: "ses", id: "bunyi", vi: "âm thanh" }
      - type: "list"
        items:
          - type: "rule"
            level: "A0"
            text:
              en: "Each vowel is short and pure: the mouth holds one shape and the sound does not glide."
              uk: "Кожен голосний короткий і чистий: рот зберігає одну форму, звук не ковзає."
              es: "Cada vocal es corta y pura: la boca mantiene una forma y el sonido no se desliza."
              pt: "Cada vogal é curta e pura: a boca mantém uma forma e o som não desliza."
              fr: "Chaque voyelle est brève et pure : la bouche garde une seule forme et le son ne glisse pas."
              de: "Jeder Vokal ist kurz und rein: Der Mund behält eine Form, der Laut gleitet nicht."
              it: "Ogni vocale è breve e pura: la bocca mantiene una forma e il suono non scivola."
              pl: "Każda samogłoska jest krótka i czysta: usta zachowują jeden kształt, dźwięk się nie ślizga."
              tr: "Her ünlü kısa ve saftır: ağız tek bir biçimde kalır, ses başka bir ünlüye kaymaz."
              id: "Setiap vokal pendek dan murni: mulut tetap pada satu bentuk dan bunyi tidak meluncur."
              vi: "Mỗi nguyên âm ngắn và thuần: miệng giữ một hình, âm không trượt."
          - type: "rule"
            level: "A0"
            text:
              en: [{ term: "う" }, " is ", { ipa: "ɯ" }, ": the lips stay relaxed and do not round."]
              uk: [{ term: "う" }, " — це ", { ipa: "ɯ" }, ": губи розслаблені й не округлюються."]
              es: [{ term: "う" }, " es ", { ipa: "ɯ" }, ": los labios quedan relajados y no se redondean."]
              pt: [{ term: "う" }, " é ", { ipa: "ɯ" }, ": os lábios ficam relaxados e não se arredondam."]
              fr: [{ term: "う" }, " est ", { ipa: "ɯ" }, " : les lèvres restent détendues, sans s’arrondir."]
              de: [{ term: "う" }, " ist ", { ipa: "ɯ" }, ": Die Lippen bleiben entspannt und werden nicht gerundet."]
              it: [{ term: "う" }, " è ", { ipa: "ɯ" }, ": le labbra restano rilassate e non si arrotondano."]
              pl: [{ term: "う" }, " to ", { ipa: "ɯ" }, ": wargi pozostają rozluźnione i nie zaokrąglają się."]
              tr: [{ term: "う" }, " ", { ipa: "ɯ" }, " sesidir: dudaklar gevşek kalır, yuvarlaklaşmaz."]
              id: [{ term: "う" }, " adalah ", { ipa: "ɯ" }, ": bibir tetap santai dan tidak dibulatkan."]
              vi: [{ term: "う" }, " là ", { ipa: "ɯ" }, ": môi thả lỏng, không tròn."]
          - type: "note"
            level: "A0"
            text:
              en: ["Two vowels in a row stay two beats, not one glide: ", { term: "あおい" }, " has three."]
              uk: ["Два голосні підряд лишаються двома морами, а не одним ковзанням: у ", { term: "あおい" }, " їх три."]
              es: ["Dos vocales seguidas siguen siendo dos moras, no un deslizamiento: ", { term: "あおい" }, " tiene tres."]
              pt: ["Duas vogais seguidas continuam sendo duas moras, não um ditongo: ", { term: "あおい" }, " tem três."]
              fr: ["Deux voyelles de suite restent deux mores, sans glissement : ", { term: "あおい" }, " en a trois."]
              de: ["Zwei Vokale hintereinander bleiben zwei Moren, kein Gleitlaut: ", { term: "あおい" }, " hat drei."]
              it: ["Due vocali di seguito restano due more, non un dittongo: ", { term: "あおい" }, " ne ha tre."]
              pl: ["Dwie samogłoski z rzędu to dwie mory, nie dyftong: ", { term: "あおい" }, " ma trzy."]
              tr: ["Art arda gelen iki ünlü tek bir kayma değil, iki mora olarak kalır: ", { term: "あおい" }, " üç moradır."]
              id: ["Dua vokal berurutan tetap dua mora, bukan satu luncuran: ", { term: "あおい" }, " punya tiga."]
              vi: ["Hai nguyên âm liền nhau vẫn là hai mora, không trượt thành một: ", { term: "あおい" }, " có ba."]
            ex: { target: "あ・お・い" }
            tr: { en: "blue", uk: "синій", es: "azul", pt: "azul", fr: "bleu", de: "blau", it: "blu", pl: "niebieski", tr: "mavi", id: "biru", vi: "xanh lam" }
  - title: { en: "The mora", uk: "Мора", es: "La mora", pt: "A mora", fr: "La more", de: "Die Mora", it: "La mora", pl: "Mora", tr: "Mora", id: "Mora", vi: "Mora" }
    role: "own"
    content:
      - type: "list"
        items:
          - type: "note"
            level: "A0"
            text:
              en: ["Japanese counts beats, called morae, not syllables: ", { term: "とうきょう" }, " has four. For the kana that write them, see ", { link: "Kana Sounds", to: ja.foundations.kana-sounds }, "."]
              uk: ["Японська рахує мори, а не склади: у ", { term: "とうきょう" }, " їх чотири. Про кани, якими їх записують, див. ", { link: "Звуки кани", to: "ja.foundations.kana-sounds" }, "."]
              es: ["El japonés cuenta moras, no sílabas: ", { term: "とうきょう" }, " tiene cuatro. Para las kana que las escriben, véase ", { link: "Los sonidos del kana", to: "ja.foundations.kana-sounds" }, "."]
              pt: ["O japonês conta moras, não sílabas: ", { term: "とうきょう" }, " tem quatro. Para os kana que as escrevem, veja ", { link: "Os sons do kana", to: "ja.foundations.kana-sounds" }, "."]
              fr: ["Le japonais compte des mores, non des syllabes : ", { term: "とうきょう" }, " en compte quatre. Pour les kana qui les écrivent, voir ", { link: "Les sons du kana", to: "ja.foundations.kana-sounds" }, "."]
              de: ["Das Japanische zählt Moren, nicht Silben: ", { term: "とうきょう" }, " hat vier. Zu den Kana, die sie schreiben, siehe ", { link: "Die Laute der Kana", to: ja.foundations.kana-sounds }, "."]
              it: ["Il giapponese conta more, non sillabe: ", { term: "とうきょう" }, " ne ha quattro. Per i kana che le scrivono, vedi ", { link: "I suoni del kana", to: "ja.foundations.kana-sounds" }, "."]
              pl: ["Japoński liczy mory, nie sylaby: ", { term: "とうきょう" }, " ma cztery. O kanach, które je zapisują, zob. ", { link: "Dźwięki kany", to: ja.foundations.kana-sounds }, "."]
              tr: ["Japonca heceleri değil, moraları sayar: ", { term: "とうきょう" }, " dört moradır. Onları yazan kanalar için bkz. ", { link: "Kana sesleri", to: "ja.foundations.kana-sounds" }, "."]
              id: ["Bahasa Jepang menghitung mora, bukan suku kata: ", { term: "とうきょう" }, " punya empat. Untuk kana yang menuliskannya, lihat ", { link: "Bunyi kana", to: "ja.foundations.kana-sounds" }, "."]
              vi: ["Tiếng Nhật đếm mora, không đếm âm tiết: ", { term: "とうきょう" }, " có bốn mora. Về các kana ghi chúng, xem ", { link: "Âm của kana", to: "ja.foundations.kana-sounds" }, "."]
      - type: "usage"
        columns:
          - { key: "rule", label: { en: "Rule", uk: "Правило", es: "Regla", pt: "Regra", fr: "Règle", de: "Regel", it: "Regola", pl: "Zasada", tr: "Kural", id: "Aturan", vi: "Quy tắc" } }
          - { key: "ex", label: { en: "Example", uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
          - { key: "morae", label: { en: "Beats", uk: "Мори", es: "Moras", pt: "Moras", fr: "Mores", de: "Moren", it: "More", pl: "Mory", tr: "Moralar", id: "Mora", vi: "Mora" } }
        rows:
          - level: "A0"
            rule:
              en: "Each kana is one beat."
              uk: "Кожна кана — одна мора."
              es: "Cada kana es una mora."
              pt: "Cada kana é uma mora."
              fr: "Chaque kana est une more."
              de: "Jedes Kana ist eine Mora."
              it: "Ogni kana è una mora."
              pl: "Każda kana to jedna mora."
              tr: "Her kana bir moradır."
              id: "Setiap kana adalah satu mora."
              vi: "Mỗi kana là một mora."
            ex: "さくら"
            morae: "さ・く・ら"
            tr: { en: "cherry blossom", uk: "вишневий цвіт", es: "flor de cerezo", pt: "flor de cerejeira", fr: "fleur de cerisier", de: "Kirschblüte", it: "fiore di ciliegio", pl: "kwiat wiśni", tr: "kiraz çiçeği", id: "bunga sakura", vi: "hoa anh đào" }
          - level: "A0"
            rule:
              en: ["A small ", { term: "ゃ" }, ", ", { term: "ゅ" }, " or ", { term: "ょ" }, " joins the kana before it."]
              uk: ["Мала ", { term: "ゃ" }, ", ", { term: "ゅ" }, " або ", { term: "ょ" }, " зливається з попередньою каною."]
              es: ["Una ", { term: "ゃ" }, ", ", { term: "ゅ" }, " o ", { term: "ょ" }, " pequeña se une a la kana anterior."]
              pt: ["Um ", { term: "ゃ" }, ", ", { term: "ゅ" }, " ou ", { term: "ょ" }, " pequeno une-se ao kana anterior."]
              fr: ["Un petit ", { term: "ゃ" }, ", ", { term: "ゅ" }, " ou ", { term: "ょ" }, " se joint au kana qui précède."]
              de: ["Ein kleines ", { term: "ゃ" }, ", ", { term: "ゅ" }, " oder ", { term: "ょ" }, " verbindet sich mit dem Kana davor."]
              it: ["Una ", { term: "ゃ" }, ", ", { term: "ゅ" }, " o ", { term: "ょ" }, " piccola si unisce al kana precedente."]
              pl: ["Mała ", { term: "ゃ" }, ", ", { term: "ゅ" }, " lub ", { term: "ょ" }, " łączy się z poprzednią kaną."]
              tr: ["Küçük ", { term: "ゃ" }, ", ", { term: "ゅ" }, " veya ", { term: "ょ" }, " önündeki kanayla birleşir."]
              id: [{ term: "ゃ" }, ", ", { term: "ゅ" }, ", atau ", { term: "ょ" }, " kecil menyatu dengan kana di depannya."]
              vi: [{ term: "ゃ" }, ", ", { term: "ゅ" }, " hoặc ", { term: "ょ" }, " nhỏ ghép với kana đứng trước."]
            ex: "きょう"
            morae: "きょ・う"
            tr: { en: "today", uk: "сьогодні", es: "hoy", pt: "hoje", fr: "aujourd’hui", de: "heute", it: "oggi", pl: "dzisiaj", tr: "bugün", id: "hari ini", vi: "hôm nay" }
          - level: "A0"
            rule:
              en: [{ term: "ん" }, " is a full beat."]
              uk: [{ term: "ん" }, " — повноцінна мора."]
              es: [{ term: "ん" }, " es una mora completa."]
              pt: [{ term: "ん" }, " é uma mora inteira."]
              fr: [{ term: "ん" }, " est une more à part entière."]
              de: [{ term: "ん" }, " ist eine volle Mora."]
              it: [{ term: "ん" }, " è una mora intera."]
              pl: [{ term: "ん" }, " to pełna mora."]
              tr: [{ term: "ん" }, " tam bir moradır."]
              id: [{ term: "ん" }, " adalah satu mora penuh."]
              vi: [{ term: "ん" }, " là một mora đầy đủ."]
            ex: "ほん"
            morae: "ほ・ん"
            tr: { en: "book", uk: "книга", es: "libro", pt: "livro", fr: "livre", de: "Buch", it: "libro", pl: "książka", tr: "kitap", id: "buku", vi: "sách" }
          - level: "A0"
            rule:
              en: ["A small ", { term: "っ" }, " is a full beat of silence."]
              uk: ["Мала ", { term: "っ" }, " — повна мора тиші."]
              es: ["Una ", { term: "っ" }, " pequeña es una mora completa de silencio."]
              pt: ["Um ", { term: "っ" }, " pequeno é uma mora inteira de silêncio."]
              fr: ["Un petit ", { term: "っ" }, " est une more entière de silence."]
              de: ["Ein kleines ", { term: "っ" }, " ist eine volle Mora Stille."]
              it: ["Una ", { term: "っ" }, " piccola è una mora intera di silenzio."]
              pl: ["Mała ", { term: "っ" }, " to pełna mora ciszy."]
              tr: ["Küçük ", { term: "っ" }, " tam bir mora sessizliktir."]
              id: [{ term: "っ" }, " kecil adalah satu mora penuh berupa jeda."]
              vi: [{ term: "っ" }, " nhỏ là một mora im lặng trọn vẹn."]
            ex: "きって"
            morae: "き・っ・て"
            tr: { en: "stamp", uk: "марка", es: "sello", pt: "selo", fr: "timbre", de: "Briefmarke", it: "francobollo", pl: "znaczek", tr: "pul", id: "perangko", vi: "tem" }
          - level: "A0"
            rule:
              en: "A long vowel lasts two beats."
              uk: "Довгий голосний триває дві мори."
              es: "Una vocal larga dura dos moras."
              pt: "Uma vogal longa dura duas moras."
              fr: "Une voyelle longue dure deux mores."
              de: "Ein langer Vokal dauert zwei Moren."
              it: "Una vocale lunga dura due more."
              pl: "Długa samogłoska trwa dwie mory."
              tr: "Uzun ünlü iki mora sürer."
              id: "Vokal panjang berlangsung dua mora."
              vi: "Nguyên âm dài kéo dài hai mora."
            ex: "おおきい"
            morae: "お・お・き・い"
            tr: { en: "big", uk: "великий", es: "grande", pt: "grande", fr: "grand", de: "groß", it: "grande", pl: "duży", tr: "büyük", id: "besar", vi: "to, lớn" }
  - title: { en: "Consonants", uk: "Приголосні", es: "Consonantes", pt: "Consoantes", fr: "Consonnes", de: "Konsonanten", it: "Consonanti", pl: "Spółgłoski", tr: "Ünsüzler", id: "Konsonan", vi: "Phụ âm" }
    role: "own"
    content:
      - type: "inventory"
        set: "sounds"
        columns:
          - { key: "sound", label: { en: "Sound", uk: "Звук", es: "Sonido", pt: "Som", fr: "Son", de: "Laut", it: "Suono", pl: "Dźwięk", tr: "Ses", id: "Bunyi", vi: "Âm" } }
          - { key: "kana", label: { en: "Kana", uk: "Кана", es: "Kana", pt: "Kana", fr: "Kana", de: "Kana", it: "Kana", pl: "Kana", tr: "Kana", id: "Kana", vi: "Kana" } }
          - { key: "ex", label: { en: "Example", uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
