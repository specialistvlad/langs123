        columns:
          - { key: "pattern", label: { en: "Pattern", uk: "Модель", es: "Patrón", pt: "Padrão", fr: "Schéma", de: "Muster", it: "Schema", pl: "Wzór", tr: "Kalıp", id: "Pola", vi: "Mẫu" } }
          - { key: "ex", label: { en: "Example", uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
          - { key: "pitch", label: { en: "Pitch", uk: "Тон", es: "Tono", pt: "Tom", fr: "Hauteur", de: "Tonhöhe", it: "Tono", pl: "Wysokość tonu", tr: "Perde", id: "Nada", vi: "Cao độ" } }
        rows:
          - { level: "A1", pattern: { en: [{ term: "あたまだか" }, " (high at the start): high first, then low."], uk: [{ term: "あたまだか" }, " (високий початок): спершу високо, далі низько."], es: [{ term: "あたまだか" }, " (alto al inicio): primero alto, luego bajo."], pt: [{ term: "あたまだか" }, " (alto no início): primeiro alto, depois baixo."], fr: [{ term: "あたまだか" }, " (haut au début) : d’abord haut, puis bas."], de: [{ term: "あたまだか" }, " (Anfang hoch): zuerst hoch, dann tief."], it: [{ term: "あたまだか" }, " (alto all’inizio): prima alto, poi basso."], pl: [{ term: "あたまだか" }, " (wysoki początek): najpierw wysoko, potem nisko."], tr: [{ term: "あたまだか" }, " (baş yüksek): önce yüksek, sonra alçak."], id: [{ term: "あたまだか" }, " (kepala tinggi): tinggi dulu, lalu rendah."], vi: [{ term: "あたまだか" }, " (cao ở đầu): cao trước, thấp sau."] }, ex: [{ kanji: "雨", reading: "あめ" }, "が"], pitch: { ipa: "a˥me˩ga˩" }, tr: { en: "rain", uk: "дощ", es: "lluvia", pt: "chuva", fr: "pluie", de: "Regen", it: "pioggia", pl: "deszcz", tr: "yağmur", id: "hujan", vi: "mưa" } }
          - { level: "A1", pattern: { en: [{ term: "へいばん" }, " (flat): low, then high to the end; the particle stays high."], uk: [{ term: "へいばん" }, " (плаский): низько, далі високо до кінця; частка теж висока."], es: [{ term: "へいばん" }, " (plano): bajo, luego alto hasta el final; la partícula sigue alta."], pt: [{ term: "へいばん" }, " (plano): baixo, depois alto até o fim; a partícula continua alta."], fr: [{ term: "へいばん" }, " (plat) : bas, puis haut jusqu’à la fin ; la particule reste haute."], de: [{ term: "へいばん" }, " (flach): tief, dann hoch bis zum Ende; die Partikel bleibt hoch."], it: [{ term: "へいばん" }, " (piatto): basso, poi alto fino alla fine; la particella resta alta."], pl: [{ term: "へいばん" }, " (płaski): nisko, potem wysoko do końca; partykuła też jest wysoka."], tr: [{ term: "へいばん" }, " (düz): alçak, sonra sonuna kadar yüksek; edat da yüksek kalır."], id: [{ term: "へいばん" }, " (datar): rendah, lalu tinggi sampai akhir; partikel tetap tinggi."], vi: [{ term: "へいばん" }, " (phẳng): thấp, rồi cao đến hết; trợ từ vẫn cao."] }, ex: [{ kanji: "友達", reading: "ともだち" }, "が"], pitch: { ipa: "to˩mo˥da˥tɕi˥ga˥" }, tr: { en: "friend", uk: "друг", es: "amigo", pt: "amigo", fr: "ami", de: "Freund", it: "amico", pl: "przyjaciel", tr: "arkadaş", id: "teman", vi: "bạn" } }
          - { level: "A1", pattern: { en: [{ term: "なかだか" }, " (high in the middle): low, high, then a fall inside the word."], uk: [{ term: "なかだか" }, " (високий усередині): низько, високо, потім спад усередині слова."], es: [{ term: "なかだか" }, " (alto en el medio): bajo, alto y una caída dentro de la palabra."], pt: [{ term: "なかだか" }, " (alto no meio): baixo, alto e uma queda dentro da palavra."], fr: [{ term: "なかだか" }, " (haut au milieu) : bas, haut, puis une chute dans le mot."], de: [{ term: "なかだか" }, " (Mitte hoch): tief, hoch, dann ein Abfall im Wort."], it: [{ term: "なかだか" }, " (alto al centro): basso, alto e una discesa dentro la parola."], pl: [{ term: "なかだか" }, " (wysoki w środku): nisko, wysoko, potem spadek wewnątrz wyrazu."], tr: [{ term: "なかだか" }, " (orta yüksek): alçak, yüksek, sonra sözcük içinde düşüş."], id: [{ term: "なかだか" }, " (tengah tinggi): rendah, tinggi, lalu turun di dalam kata."], vi: [{ term: "なかだか" }, " (cao ở giữa): thấp, cao, rồi hạ xuống trong từ."] }, ex: [{ kanji: "先生", reading: "せんせい" }, "が"], pitch: { ipa: "se˩n˥se˥i˩ga˩" }, tr: { en: "teacher", uk: "учитель", es: "profesor", pt: "professor", fr: "professeur", de: "Lehrer", it: "insegnante", pl: "nauczyciel", tr: "öğretmen", id: "guru", vi: "giáo viên" } }
          - { level: "A2", pattern: { en: [{ term: "おだか" }, " (high at the end): low, then high to the end; the particle falls."], uk: [{ term: "おだか" }, " (високий наприкінці): низько, далі високо до кінця; частка падає."], es: [{ term: "おだか" }, " (alto al final): bajo, luego alto hasta el final; la partícula baja."], pt: [{ term: "おだか" }, " (alto no fim): baixo, depois alto até o fim; a partícula cai."], fr: [{ term: "おだか" }, " (haut à la fin) : bas, puis haut jusqu’à la fin ; la particule descend."], de: [{ term: "おだか" }, " (Ende hoch): tief, dann hoch bis zum Ende; die Partikel fällt."], it: [{ term: "おだか" }, " (alto alla fine): basso, poi alto fino alla fine; la particella scende."], pl: [{ term: "おだか" }, " (wysoki na końcu): nisko, potem wysoko do końca; partykuła spada."], tr: [{ term: "おだか" }, " (son yüksek): alçak, sonra sonuna kadar yüksek; edat düşer."], id: [{ term: "おだか" }, " (ekor tinggi): rendah, lalu tinggi sampai akhir; partikel turun."], vi: [{ term: "おだか" }, " (cao ở cuối): thấp, rồi cao đến hết; trợ từ hạ xuống."] }, ex: [{ kanji: "橋", reading: "はし" }, "が"], pitch: { ipa: "ha˩si˥ga˩" }, tr: { en: "bridge", uk: "міст", es: "puente", pt: "ponte", fr: "pont", de: "Brücke", it: "ponte", pl: "most", tr: "köprü", id: "jembatan", vi: "cầu" } }
          - { level: "A1", pattern: { en: "The same sounds, a different pitch, a different word.", uk: "Ті самі звуки, інший тон — інше слово.", es: "Mismos sonidos, otro tono, otra palabra.", pt: "Mesmos sons, outro tom, outra palavra.", fr: "Mêmes sons, autre hauteur, autre mot.", de: "Gleiche Laute, andere Tonhöhe, anderes Wort.", it: "Stessi suoni, altro tono, altra parola.", pl: "Te same dźwięki, inny ton, inny wyraz.", tr: "Aynı sesler, farklı perde, farklı sözcük.", id: "Bunyi sama, nada berbeda, kata berbeda.", vi: "Cùng âm, khác cao độ, khác từ." }, ex: { examples: [{ kanji: "雨", reading: "あめ" }, "あめ"] }, pitch: [{ ipa: "a˥me˩" }, " ", { ipa: "a˩me˥" }], tr: { en: { examples: ["rain", "candy"] }, uk: { examples: ["дощ", "цукерка"] }, es: { examples: ["lluvia", "caramelo"] }, pt: { examples: ["chuva", "bala"] }, fr: { examples: ["pluie", "bonbon"] }, de: { examples: ["Regen", "Bonbon"] }, it: { examples: ["pioggia", "caramella"] }, pl: { examples: ["deszcz", "cukierek"] }, tr: { examples: ["yağmur", "şeker"] }, id: { examples: ["hujan", "permen"] }, vi: { examples: ["mưa", "kẹo"] } } }
          - { level: "A2", pattern: { en: "A particle shows the difference when the word alone sounds the same.", uk: "Частка показує різницю, коли окреме слово звучить однаково.", es: "La partícula muestra la diferencia cuando la palabra sola suena igual.", pt: "A partícula mostra a diferença quando a palavra sozinha soa igual.", fr: "La particule montre la différence quand le mot seul sonne pareil.", de: "Die Partikel zeigt den Unterschied, wenn das Wort allein gleich klingt.", it: "La particella mostra la differenza quando la parola da sola suona uguale.", pl: "Partykuła pokazuje różnicę, gdy sam wyraz brzmi tak samo.", tr: "Sözcük tek başına aynı duyulduğunda fark edatla ortaya çıkar.", id: "Partikel menunjukkan perbedaan ketika kata itu sendirian terdengar sama.", vi: "Trợ từ cho thấy sự khác biệt khi từ đứng một mình nghe giống nhau." }, ex: { examples: [[{ kanji: "橋", reading: "はし" }, "が"], "はしが"] }, pitch: [{ ipa: "ha˩si˥ga˩" }, " ", { ipa: "ha˩si˥ga˥" }], tr: { en: { examples: ["the bridge", "the edge"] }, uk: { examples: ["міст", "край"] }, es: { examples: ["el puente", "el borde"] }, pt: { examples: ["a ponte", "a beira"] }, fr: { examples: ["le pont", "le bord"] }, de: { examples: ["die Brücke", "der Rand"] }, it: { examples: ["il ponte", "il bordo"] }, pl: { examples: ["most", "brzeg"] }, tr: { examples: ["köprü", "kenar"] }, id: { examples: ["jembatan", "tepi"] }, vi: { examples: ["cây cầu", "mép"] } } }
