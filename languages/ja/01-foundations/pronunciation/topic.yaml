        - level: "A1"
          point: { en: "Pitch", uk: "Тон", es: "Tono", pt: "Tom", fr: "Hauteur", de: "Tonhöhe", it: "Tono", pl: "Wysokość tonu", tr: "Perde", id: "Nada", vi: "Cao độ" }
          rule:
            en: "Pitch, not loudness, tells words apart; after a fall it does not rise again."
