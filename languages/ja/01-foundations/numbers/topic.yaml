            tr: { pattern: [{ slot: "number" }, { term: { kanji: "円", reading: "えん" } }] }
            id: { pattern: [{ slot: "number" }, { term: { kanji: "円", reading: "えん" } }] }
            vi: { pattern: [{ slot: "number" }, { term: { kanji: "円", reading: "えん" } }] }
          tr: { en: "It is 300 yen.", uk: "Це коштує 300 єн.", es: "Cuesta 300 yenes.", pt: "Custa 300 ienes.", fr: "Ça coûte 300 yens.", de: "Das kostet 300 Yen.", it: "Costa 300 yen.", pl: "To kosztuje 300 jenów.", tr: "Fiyatı 300 yen.", id: "Harganya 300 yen.", vi: "Giá 300 yên." }
          ex: [{ numeral: [{ kanji: "三", reading: "さん" }, { kanji: "百", reading: "びゃく" }], value: 300 }, { target: { kanji: "円", reading: "えん" } }, "です。"]
        - level: "A2"
