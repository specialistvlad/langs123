            uk: [{ term: { kanji: "万", reading: "まん" } }, " — це 10 000, і ", { term: { kanji: "一", reading: "いち" } }, " перед ним лишається"]
            es: [{ term: { kanji: "万", reading: "まん" } }, " es 10 000 y ", { term: { kanji: "一", reading: "いち" } }, " se mantiene delante"]
            pt: [{ term: { kanji: "万", reading: "まん" } }, " é 10 000 e ", { term: { kanji: "一", reading: "いち" } }, " permanece antes"]
            fr: [{ term: { kanji: "万", reading: "まん" } }, " vaut 10 000 et ", { term: { kanji: "一", reading: "いち" } }, " reste devant"]
            de: [{ term: { kanji: "万", reading: "まん" } }, " ist 10 000, und ", { term: { kanji: "一", reading: "いち" } }, " bleibt davor"]
            it: [{ term: { kanji: "万", reading: "まん" } }, " è 10 000 e ", { term: { kanji: "一", reading: "いち" } }, " resta davanti"]
            pl: [{ term: { kanji: "万", reading: "まん" } }, " to 10 000, a ", { term: { kanji: "一", reading: "いち" } }, " zostaje przed nim"]
            tr: [{ term: { kanji: "万", reading: "まん" } }, " 10 000’dir ve önünde ", { term: { kanji: "一", reading: "いち" } }, " kalır"]
            id: [{ term: { kanji: "万", reading: "まん" } }, " adalah 10 000, dan ", { term: { kanji: "一", reading: "いち" } }, " tetap di depannya"]
            vi: [{ term: { kanji: "万", reading: "まん" } }, " là 10 000, và ", { term: { kanji: "一", reading: "いち" } }, " vẫn đứng trước nó"]
          tr: { en: { examples: ["10 000", "100 000", "1 000 000"] }, uk: { examples: ["10 000", "100 000", "1 000 000"] }, es: { examples: ["10 000", "100 000", "1 000 000"] }, pt: { examples: ["10 000", "100 000", "1 000 000"] }, fr: { examples: ["10 000", "100 000", "1 000 000"] }, de: { examples: ["10 000", "100 000", "1 000 000"] }, it: { examples: ["10 000", "100 000", "1 000 000"] }, pl: { examples: ["10 000", "100 000", "1 000 000"] }, tr: { examples: ["10 000", "100 000", "1 000 000"] }, id: { examples: ["10 000", "100 000", "1 000 000"] }, vi: { examples: ["10 000", "100 000", "1 000 000"] } }
          ex: { examples: [{ numeral: [{ kanji: "一", reading: "いち" }, { target: { kanji: "万", reading: "まん" } }], value: 10000 }, { numeral: [{ kanji: "十", reading: "じゅう" }, { target: { kanji: "万", reading: "まん" } }], value: 100000 }, { numeral: [{ kanji: "百", reading: "ひゃく" }, { target: { kanji: "万", reading: "まん" } }], value: 1000000 }] }
        - level: "A1"
          point: { en: "Trap", uk: "Пастка", es: "Trampa", pt: "Armadilha", fr: "Piège", de: "Falle", it: "Trappola", pl: "Pułapka", tr: "Tuzak", id: "Jebakan", vi: "Bẫy" }
          rule:
            en: ["100 takes no ", { term: "いち" }, " before it"]
            uk: ["перед 100 немає ", { term: "いち" }]
            es: ["100 no lleva ", { term: "いち" }, " delante"]
            pt: ["100 não leva ", { term: "いち" }, " antes"]
            fr: ["100 n’a pas de ", { term: "いち" }, " devant"]
            de: ["vor 100 steht kein ", { term: "いち" }]
            it: ["100 non vuole ", { term: "いち" }, " davanti"]
            pl: ["przed 100 nie ma ", { term: "いち" }]
            tr: ["100’ün önüne ", { term: "いち" }, " gelmez"]
            id: ["100 tidak memakai ", { term: "いち" }, " di depannya"]
            vi: ["100 không có ", { term: "いち" }, " đứng trước"]
          tr: { en: "100", uk: "100", es: "100", pt: "100", fr: "100", de: "100", it: "100", pl: "100", tr: "100", id: "100", vi: "100" }
          ex: { numeral: { target: "ひゃく" }, value: 100 }
        - level: "A2"
          point: { en: "Trap", uk: "Пастка", es: "Trampa", pt: "Armadilha", fr: "Piège", de: "Falle", it: "Trappola", pl: "Pułapka", tr: "Tuzak", id: "Jebakan", vi: "Bẫy" }
          rule:
            en: ["10 000 is one ", { term: { kanji: "万", reading: "まん" } }, ", never ten ", { term: { kanji: "千", reading: "せん" } }]
            uk: ["10 000 — це один ", { term: { kanji: "万", reading: "まん" } }, ", а не десять ", { term: { kanji: "千", reading: "せん" } }]
            es: ["10 000 es un ", { term: { kanji: "万", reading: "まん" } }, ", nunca diez ", { term: { kanji: "千", reading: "せん" } }]
            pt: ["10 000 é um ", { term: { kanji: "万", reading: "まん" } }, ", nunca dez ", { term: { kanji: "千", reading: "せん" } }]
            fr: ["10 000 est un ", { term: { kanji: "万", reading: "まん" } }, ", jamais dix ", { term: { kanji: "千", reading: "せん" } }]
            de: ["10 000 ist ein ", { term: { kanji: "万", reading: "まん" } }, ", nie zehn ", { term: { kanji: "千", reading: "せん" } }]
            it: ["10 000 è un ", { term: { kanji: "万", reading: "まん" } }, ", mai dieci ", { term: { kanji: "千", reading: "せん" } }]
            pl: ["10 000 to jeden ", { term: { kanji: "万", reading: "まん" } }, ", nigdy dziesięć ", { term: { kanji: "千", reading: "せん" } }]
            tr: ["10 000 bir ", { term: { kanji: "万", reading: "まん" } }, "’dır, on ", { term: { kanji: "千", reading: "せん" } }, " değil"]
            id: ["10 000 adalah satu ", { term: { kanji: "万", reading: "まん" } }, ", bukan sepuluh ", { term: { kanji: "千", reading: "せん" } }]
            vi: ["10 000 là một ", { term: { kanji: "万", reading: "まん" } }, ", không phải mười ", { term: { kanji: "千", reading: "せん" } }]
          tr: { en: "10 000", uk: "10 000", es: "10 000", pt: "10 000", fr: "10 000", de: "10 000", it: "10 000", pl: "10 000", tr: "10 000", id: "10 000", vi: "10 000" }
          ex: { numeral: { target: [{ kanji: "一", reading: "いち" }, { kanji: "万", reading: "まん" }] }, value: 10000 }
sections:
  - title:
      en: "0 to 10"
      uk: "Від 0 до 10"
      es: "Del 0 al 10"
      pt: "De 0 a 10"
      fr: "De 0 à 10"
      de: "0 bis 10"
      it: "Da 0 a 10"
      pl: "Od 0 do 10"
      tr: "0’dan 10’a kadar"
      id: "0 sampai 10"
      vi: "Từ 0 đến 10"
    role: "own"
    content:
      - type: "inventory"
        set: "numbers"
        columns:
          - { key: "number", label: { en: "Number", uk: "Число", es: "Número", pt: "Número", fr: "Nombre", de: "Zahl", it: "Numero", pl: "Liczba", tr: "Sayı", id: "Angka", vi: "Số" } }
          - { key: "word", label: { en: "Word", uk: "Слово", es: "Palabra", pt: "Palavra", fr: "Mot", de: "Wort", it: "Parola", pl: "Słowo", tr: "Sözcük", id: "Kata", vi: "Từ" } }
        rows:
          - { level: "A0", value: 0, number: "0", word: { alternatives: ["ゼロ", "れい"] } }
          - { level: "A0", value: 1, number: "1", word: "いち" }
          - { level: "A0", value: 2, number: "2", word: "に" }
          - { level: "A0", value: 3, number: "3", word: "さん" }
          - { level: "A0", value: 4, number: "4", word: { alternatives: ["よん", "し"] } }
          - { level: "A0", value: 5, number: "5", word: "ご" }
          - { level: "A0", value: 6, number: "6", word: "ろく" }
          - { level: "A0", value: 7, number: "7", word: { alternatives: ["なな", "しち"] } }
          - { level: "A0", value: 8, number: "8", word: "はち" }
          - { level: "A0", value: 9, number: "9", word: { alternatives: ["きゅう", "く"] } }
          - { level: "A0", value: 10, number: "10", word: "じゅう" }
      - type: "list"
        items:
          - type: "rule"
            level: "A0"
            text:
              en: ["Four, seven and nine have two readings each; when counting, say ", { term: "よん" }, ", ", { term: "なな" }, " and ", { term: "きゅう" }, "."]
              uk: ["Чотири, сім і дев’ять мають по два читання; у лічбі кажуть ", { term: "よん" }, ", ", { term: "なな" }, " і ", { term: "きゅう" }, "."]
              es: ["El cuatro, el siete y el nueve tienen dos lecturas; al contar se dice ", { term: "よん" }, ", ", { term: "なな" }, " y ", { term: "きゅう" }, "."]
              pt: ["O quatro, o sete e o nove têm duas leituras; ao contar, diz-se ", { term: "よん" }, ", ", { term: "なな" }, " e ", { term: "きゅう" }, "."]
              fr: ["Quatre, sept et neuf ont deux lectures ; pour compter, on dit ", { term: "よん" }, ", ", { term: "なな" }, " et ", { term: "きゅう" }, "."]
              de: ["Vier, sieben und neun haben zwei Lesungen; beim Zählen sagt man ", { term: "よん" }, ", ", { term: "なな" }, " und ", { term: "きゅう" }, "."]
              it: ["Quattro, sette e nove hanno due letture; per contare si dice ", { term: "よん" }, ", ", { term: "なな" }, " e ", { term: "きゅう" }, "."]
              pl: ["Cztery, siedem i dziewięć mają po dwa odczyty; przy liczeniu mówi się ", { term: "よん" }, ", ", { term: "なな" }, " i ", { term: "きゅう" }, "."]
              tr: ["Dört, yedi ve dokuzun ikişer okunuşu vardır; sayarken ", { term: "よん" }, ", ", { term: "なな" }, " ve ", { term: "きゅう" }, " denir."]
              id: ["Empat, tujuh, dan sembilan masing-masing punya dua cara baca; saat menghitung, ucapkan ", { term: "よん" }, ", ", { term: "なな" }, ", dan ", { term: "きゅう" }, "."]
              vi: ["Bốn, bảy và chín đều có hai cách đọc; khi đếm, hãy nói ", { term: "よん" }, ", ", { term: "なな" }, " và ", { term: "きゅう" }, "."]
            ex: { examples: [{ numeral: { target: "よん" }, value: 4 }, { numeral: { target: "なな" }, value: 7 }, { numeral: { target: "きゅう" }, value: 9 }] }
            tr: { en: { examples: ["4", "7", "9"] }, uk: { examples: ["4", "7", "9"] }, es: { examples: ["4", "7", "9"] }, pt: { examples: ["4", "7", "9"] }, fr: { examples: ["4", "7", "9"] }, de: { examples: ["4", "7", "9"] }, it: { examples: ["4", "7", "9"] }, pl: { examples: ["4", "7", "9"] }, tr: { examples: ["4", "7", "9"] }, id: { examples: ["4", "7", "9"] }, vi: { examples: ["4", "7", "9"] } }
          - type: "note"
            level: "A0"
            text:
              en: [{ term: "し" }, ", ", { term: "しち" }, " and ", { term: "く" }, " live on in fixed words: see ", { link: "Days, Months and Dates", to: ja.foundations.days-months-dates }, " and ", { link: "Telling the Time", to: ja.foundations.telling-time }, "."]
              uk: [{ term: "し" }, ", ", { term: "しち" }, " і ", { term: "く" }, " збереглися в сталих словах: див. ", { link: "Дні, місяці й дати", to: "ja.foundations.days-months-dates" }, " та ", { link: "Котра година", to: ja.foundations.telling-time }, "."]
              es: [{ term: "し" }, ", ", { term: "しち" }, " y ", { term: "く" }, " sobreviven en palabras fijas: véase ", { link: "Días, meses y fechas", to: "ja.foundations.days-months-dates" }, " y ", { link: "La hora", to: "ja.foundations.telling-time" }, "."]
              pt: [{ term: "し" }, ", ", { term: "しち" }, " e ", { term: "く" }, " sobrevivem em palavras fixas: veja ", { link: "Dias, meses e datas", to: "ja.foundations.days-months-dates" }, " e ", { link: "As horas", to: "ja.foundations.telling-time" }, "."]
              fr: [{ term: "し" }, ", ", { term: "しち" }, " et ", { term: "く" }, " subsistent dans des mots figés : voir ", { link: "Jours, mois et dates", to: "ja.foundations.days-months-dates" }, " et ", { link: "L’heure", to: "ja.foundations.telling-time" }, "."]
              de: [{ term: "し" }, ", ", { term: "しち" }, " und ", { term: "く" }, " leben in festen Wörtern weiter: siehe ", { link: "Tage, Monate und Datumsangaben", to: ja.foundations.days-months-dates }, " und ", { link: "Die Uhrzeit", to: "ja.foundations.telling-time" }, "."]
              it: [{ term: "し" }, ", ", { term: "しち" }, " e ", { term: "く" }, " restano in parole fisse: vedi ", { link: "Giorni, mesi e date", to: "ja.foundations.days-months-dates" }, " e ", { link: "Dire l'ora", to: ja.foundations.telling-time }, "."]
              pl: [{ term: "し" }, ", ", { term: "しち" }, " i ", { term: "く" }, " przetrwały w stałych wyrazach: zob. ", { link: "Dni, miesiące i daty", to: "ja.foundations.days-months-dates" }, " i ", { link: "Podawanie godziny", to: ja.foundations.telling-time }, "."]
              tr: [{ term: "し" }, ", ", { term: "しち" }, " ve ", { term: "く" }, " kalıplaşmış sözcüklerde yaşar: bkz. ", { link: "Günler, aylar ve tarihler", to: "ja.foundations.days-months-dates" }, " ve ", { link: "Saati söyleme", to: ja.foundations.telling-time }, "."]
              id: [{ term: "し" }, ", ", { term: "しち" }, ", dan ", { term: "く" }, " bertahan dalam kata-kata tetap: lihat ", { link: "Hari, bulan, dan tanggal", to: "ja.foundations.days-months-dates" }, " dan ", { link: "Menyebutkan jam", to: ja.foundations.telling-time }, "."]
              vi: [{ term: "し" }, ", ", { term: "しち" }, " và ", { term: "く" }, " còn lại trong các từ cố định: xem ", { link: "Thứ, tháng và ngày", to: ja.foundations.days-months-dates }, " và ", { link: "Nói giờ", to: ja.foundations.telling-time }, "."]
          - type: "rule"
            level: "A0"
            text:
              en: ["0 has two words: ", { term: "ゼロ" }, " in daily speech and ", { term: "れい" }, " in maths and temperatures."]
              uk: ["Нуль має два слова: ", { term: "ゼロ" }, " у щоденному мовленні та ", { term: "れい" }, " у математиці й температурі."]
              es: ["El 0 tiene dos palabras: ", { term: "ゼロ" }, " en el habla diaria y ", { term: "れい" }, " en matemáticas y temperaturas."]
              pt: ["O 0 tem duas palavras: ", { term: "ゼロ" }, " na fala diária e ", { term: "れい" }, " na matemática e nas temperaturas."]
              fr: ["Le 0 a deux mots : ", { term: "ゼロ" }, " dans la langue courante et ", { term: "れい" }, " en mathématiques et pour les températures."]
              de: ["Die 0 hat zwei Wörter: ", { term: "ゼロ" }, " im Alltag und ", { term: "れい" }, " in der Mathematik und bei Temperaturen."]
              it: ["Lo 0 ha due parole: ", { term: "ゼロ" }, " nel parlato quotidiano e ", { term: "れい" }, " in matematica e per le temperature."]
              pl: ["Zero ma dwa wyrazy: ", { term: "ゼロ" }, " w mowie codziennej i ", { term: "れい" }, " w matematyce oraz przy temperaturach."]
              tr: ["0’ın iki sözcüğü vardır: günlük konuşmada ", { term: "ゼロ" }, ", matematikte ve sıcaklıklarda ", { term: "れい" }, "."]
              id: ["Angka 0 punya dua kata: ", { term: "ゼロ" }, " dalam percakapan sehari-hari dan ", { term: "れい" }, " dalam matematika dan suhu."]
              vi: ["Số 0 có hai từ: ", { term: "ゼロ" }, " trong lời nói hằng ngày và ", { term: "れい" }, " trong toán học và nhiệt độ."]
          - type: "note"
            level: "A0"
            text:
              en: "Everyday writing uses digits (1, 2, 3); kanji numerals appear later in this topic."
              uk: "У повсякденному письмі вживають цифри (1, 2, 3); числа кандзі з’являються далі в цій темі."
              es: "La escritura diaria usa cifras (1, 2, 3); los numerales en kanji aparecen más adelante en este tema."
              pt: "A escrita diária usa algarismos (1, 2, 3); os numerais em kanji aparecem mais adiante neste tópico."
              fr: "L’écriture courante emploie les chiffres (1, 2, 3) ; les chiffres en kanji apparaissent plus loin dans ce sujet."
              de: "Im Alltag schreibt man Ziffern (1, 2, 3); Zahlen in Kanji folgen weiter unten in diesem Thema."
              it: "La scrittura quotidiana usa le cifre (1, 2, 3); i numeri in kanji compaiono più avanti in questo argomento."
              pl: "W codziennym piśmie używa się cyfr (1, 2, 3); liczby w kanji pojawiają się dalej w tym temacie."
              tr: "Günlük yazıda rakamlar (1, 2, 3) kullanılır; kanji ile yazılan sayılar bu konunun ilerisinde yer alır."
              id: "Tulisan sehari-hari memakai angka (1, 2, 3); angka kanji muncul nanti dalam topik ini."
              vi: "Văn viết hằng ngày dùng chữ số (1, 2, 3); số viết bằng kanji xuất hiện ở phần sau của chủ đề này."
          - type: "note"
            level: "A1"
            text:
              en: ["Counting things and people takes a counter after the number: see ", { link: "Counters", to: "ja.foundations.counters" }, "."]
              uk: ["Щоб лічити речі й людей, після числа ставлять лічильне слово: див. ", { link: "Лічильні слова", to: "ja.foundations.counters" }, "."]
              es: ["Para contar cosas y personas se pone un contador tras el número: véase ", { link: "Los contadores", to: "ja.foundations.counters" }, "."]
              pt: ["Para contar coisas e pessoas, põe-se um contador depois do número: veja ", { link: "Contadores", to: ja.foundations.counters }, "."]
              fr: ["Pour compter des objets et des personnes, on place un compteur après le nombre : voir ", { link: "Les compteurs", to: "ja.foundations.counters" }, "."]
              de: ["Dinge und Personen zählt man mit einem Zählwort nach der Zahl: siehe ", { link: "Zählwörter", to: "ja.foundations.counters" }, "."]
              it: ["Per contare cose e persone si mette un contatore dopo il numero: vedi ", { link: "I contatori", to: "ja.foundations.counters" }, "."]
              pl: ["Rzeczy i osoby liczy się z licznikiem po liczbie: zob. ", { link: "Liczniki", to: "ja.foundations.counters" }, "."]
              tr: ["Nesneleri ve kişileri saymak için sayıdan sonra bir sayaç gelir: bkz. ", { link: "Sayaçlar", to: "ja.foundations.counters" }, "."]
              id: ["Untuk menghitung benda dan orang, kata bantu bilangan dipasang setelah angka: lihat ", { link: "Kata bantu bilangan", to: "ja.foundations.counters" }, "."]
              vi: ["Muốn đếm đồ vật và người, đặt lượng từ sau số: xem ", { link: "Lượng từ", to: "ja.foundations.counters" }, "."]
  - title:
      en: "11 to 99"
      uk: "Від 11 до 99"
      es: "Del 11 al 99"
      pt: "De 11 a 99"
      fr: "De 11 à 99"
      de: "11 bis 99"
      it: "Da 11 a 99"
      pl: "Od 11 do 99"
      tr: "11’den 99’a kadar"
      id: "11 sampai 99"
      vi: "Từ 11 đến 99"
    role: "own"
    content:
      - type: "inventory"
        set: "numbers"
        columns:
          - { key: "number", label: { en: "Number", uk: "Число", es: "Número", pt: "Número", fr: "Nombre", de: "Zahl", it: "Numero", pl: "Liczba", tr: "Sayı", id: "Angka", vi: "Số" } }
          - { key: "word", label: { en: "Word", uk: "Слово", es: "Palabra", pt: "Palavra", fr: "Mot", de: "Wort", it: "Parola", pl: "Słowo", tr: "Sözcük", id: "Kata", vi: "Từ" } }
        rows:
          - { level: "A0", value: 20, number: "20", word: "にじゅう" }
          - { level: "A0", value: 30, number: "30", word: "さんじゅう" }
          - { level: "A0", value: 40, number: "40", word: "よんじゅう" }
          - { level: "A0", value: 50, number: "50", word: "ごじゅう" }
          - { level: "A0", value: 60, number: "60", word: "ろくじゅう" }
          - { level: "A0", value: 70, number: "70", word: "ななじゅう" }
          - { level: "A0", value: 80, number: "80", word: "はちじゅう" }
          - { level: "A0", value: 90, number: "90", word: "きゅうじゅう" }
      - type: "usage"
