sections:
  - title:
      en: "Kanji and kana"
      uk: "Кандзі та кана"
      es: "Kanji y kana"
      pt: "Kanji e kana"
      fr: "Kanji et kana"
      de: "Kanji und Kana"
      it: "Kanji e kana"
      pl: "Kanji i kana"
      tr: "Kanji ve kana"
      id: "Kanji dan kana"
      vi: "Kanji và kana"
    role: "own"
    content:
      - type: "list"
        items:
          - type: "rule"
            level: "A1"
            text:
              en: "Kanji came from China; each character stands for a meaning."
              uk: "Кандзі прийшли з Китаю; кожен знак передає значення."
              es: "Los kanji vienen de China; cada carácter representa un significado."
              pt: "Os kanji vieram da China; cada caractere representa um significado."
              fr: "Les kanji viennent de Chine ; chaque caractère représente un sens."
              de: "Kanji stammen aus China; jedes Zeichen steht für eine Bedeutung."
              it: "I kanji vengono dalla Cina; ogni carattere rappresenta un significato."
              pl: "Kanji pochodzą z Chin; każdy znak oznacza jakieś znaczenie."
              tr: "Kanjiler Çin'den gelmiştir; her karakter bir anlamı gösterir."
              id: "Kanji berasal dari Tiongkok; setiap aksara mewakili satu makna."
              vi: "Kanji đến từ Trung Quốc; mỗi chữ biểu thị một nghĩa."
            ex: { target: { kanji: "山", reading: "やま" } }
            tr: { en: "mountain", uk: "гора", es: "montaña", pt: "montanha", fr: "montagne", de: "Berg", it: "montagna", pl: "góra", tr: "dağ", id: "gunung", vi: "núi" }
      - type: "usage"
        columns:
          - { key: "script", label: { en: "Script", uk: "Письмо", es: "Escritura", pt: "Escrita", fr: "Écriture", de: "Schrift", it: "Scrittura", pl: "Pismo", tr: "Yazı", id: "Aksara", vi: "Chữ viết" } }
          - { key: "use", label: { en: "Use", uk: "Вживання", es: "Uso", pt: "Uso", fr: "Emploi", de: "Gebrauch", it: "Uso", pl: "Użycie", tr: "Kullanım", id: "Penggunaan", vi: "Cách dùng" } }
          - { key: "ex", label: { en: "Example", uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - level: "A1"
            script:
              en: { term: { kanji: "漢字", reading: "かんじ" } }
              uk: { term: { kanji: "漢字", reading: "かんじ" } }
              es: { term: { kanji: "漢字", reading: "かんじ" } }
              pt: { term: { kanji: "漢字", reading: "かんじ" } }
              fr: { term: { kanji: "漢字", reading: "かんじ" } }
              de: { term: { kanji: "漢字", reading: "かんじ" } }
              it: { term: { kanji: "漢字", reading: "かんじ" } }
              pl: { term: { kanji: "漢字", reading: "かんじ" } }
              tr: { term: { kanji: "漢字", reading: "かんじ" } }
              id: { term: { kanji: "漢字", reading: "かんじ" } }
              vi: { term: { kanji: "漢字", reading: "かんじ" } }
            use:
              en: "The meaning: nouns and the stems of verbs and adjectives."
              uk: "Значення: іменники та основи дієслів і прикметників."
              es: "El significado: sustantivos y raíces de verbos y adjetivos."
              pt: "O significado: substantivos e radicais de verbos e adjetivos."
              fr: "Le sens : noms et radicaux des verbes et des adjectifs."
              de: "Die Bedeutung: Nomen sowie Stämme von Verben und Adjektiven."
              it: "Il significato: nomi e radici di verbi e aggettivi."
              pl: "Znaczenie: rzeczowniki oraz tematy czasowników i przymiotników."
              tr: "Anlam: isimler ile fiil ve sıfat kökleri."
              id: "Makna: kata benda serta pangkal kata kerja dan kata sifat."
              vi: "Nghĩa: danh từ và gốc của động từ, tính từ."
            ex: [{ target: { kanji: "日本", reading: "にほん" } }, "に", { kanji: "行", reading: "い" }, "きます。"]
            tr: { en: "I go to Japan.", uk: "Я їду до Японії.", es: "Voy a Japón.", pt: "Eu vou ao Japão.", fr: "Je vais au Japon.", de: "Ich fahre nach Japan.", it: "Vado in Giappone.", pl: "Jadę do Japonii.", tr: "Japonya'ya gidiyorum.", id: "Saya pergi ke Jepang.", vi: "Tôi đi Nhật Bản." }
          - level: "A1"
            script:
              en: { term: "ひらがな" }
              uk: { term: "ひらがな" }
              es: { term: "ひらがな" }
              pt: { term: "ひらがな" }
              fr: { term: "ひらがな" }
              de: { term: "ひらがな" }
              it: { term: "ひらがな" }
              pl: { term: "ひらがな" }
              tr: { term: "ひらがな" }
              id: { term: "ひらがな" }
              vi: { term: "ひらがな" }
            use:
              en: "The grammar: endings, particles and words without kanji."
              uk: "Граматика: закінчення, частки й слова без кандзі."
              es: "La gramática: terminaciones, partículas y palabras sin kanji."
              pt: "A gramática: terminações, partículas e palavras sem kanji."
              fr: "La grammaire : terminaisons, particules et mots sans kanji."
              de: "Die Grammatik: Endungen, Partikeln und Wörter ohne Kanji."
              it: "La grammatica: desinenze, particelle e parole senza kanji."
              pl: "Gramatyka: końcówki, partykuły i wyrazy bez kanji."
              tr: "Dilbilgisi: ekler, edatlar ve kanjisiz sözcükler."
              id: "Tata bahasa: akhiran, partikel, dan kata tanpa kanji."
              vi: "Ngữ pháp: đuôi từ, trợ từ và từ không có kanji."
            ex: [{ kanji: "日本", reading: "にほん" }, { target: "に" }, { kanji: "行", reading: "い" }, "き", { target: "ます" }, "。"]
            tr: { en: "I go to Japan.", uk: "Я їду до Японії.", es: "Voy a Japón.", pt: "Eu vou ao Japão.", fr: "Je vais au Japon.", de: "Ich fahre nach Japan.", it: "Vado in Giappone.", pl: "Jadę do Japonii.", tr: "Japonya'ya gidiyorum.", id: "Saya pergi ke Jepang.", vi: "Tôi đi Nhật Bản." }
          - level: "A1"
