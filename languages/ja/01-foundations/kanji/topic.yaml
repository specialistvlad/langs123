            pt: ["Depois de um número, ", { term: { kanji: "人", reading: "にん" } }, " lê-se にん: só ", { term: { kanji: "一人", reading: "ひとり" } }, " e ", { term: { kanji: "二人", reading: "ふたり" } }, " diferem."]
            fr: ["Après un nombre, ", { term: { kanji: "人", reading: "にん" } }, " se lit にん : seuls ", { term: { kanji: "一人", reading: "ひとり" } }, " et ", { term: { kanji: "二人", reading: "ふたり" } }, " diffèrent."]
            de: ["Nach einer Zahl liest man ", { term: { kanji: "人", reading: "にん" } }, " にん: nur ", { term: { kanji: "一人", reading: "ひとり" } }, " und ", { term: { kanji: "二人", reading: "ふたり" } }, " weichen ab."]
            it: ["Dopo un numero, ", { term: { kanji: "人", reading: "にん" } }, " si legge にん: solo ", { term: { kanji: "一人", reading: "ひとり" } }, " e ", { term: { kanji: "二人", reading: "ふたり" } }, " fanno eccezione."]
