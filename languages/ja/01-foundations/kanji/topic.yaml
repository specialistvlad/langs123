summary:
  lead:
    en: "Kanji carry meaning and have on and kun readings; furigana show a reading and okurigana finish a word in kana."
    uk: "Кандзі несуть значення й мають онне та кунне читання; фуріґана показує читання, а окуріґана завершує слово каною."
    es: "Los kanji llevan el significado y tienen lecturas on y kun; el furigana muestra la lectura y la okurigana termina la palabra en kana."
    pt: "Os kanji levam o significado e têm leituras on e kun; o furigana mostra a leitura e o okurigana termina a palavra em kana."
    fr: "Les kanji portent le sens et ont des lectures on et kun ; le furigana montre la lecture, l’okurigana finit le mot en kana."
    de: "Kanji tragen die Bedeutung und haben On- und Kun-Lesungen; Furigana zeigen die Lesung, Okurigana beenden das Wort in Kana."
    it: "I kanji portano il significato e hanno letture on e kun; il furigana mostra la lettura, l’okurigana chiude la parola in kana."
    pl: "Kanji niosą znaczenie i mają czytania on i kun; furigana pokazuje czytanie, a okurigana kończy wyraz kaną."
    tr: "Kanjiler anlamı taşır, on ve kun okunuşları vardır; furigana okunuşu gösterir, okurigana sözcüğü kanayla bitirir."
    id: "Kanji membawa makna dan punya bacaan on dan kun; furigana menunjukkan bacaan, okurigana mengakhiri kata dengan kana."
    vi: "Kanji mang nghĩa và có âm on, âm kun; furigana cho biết cách đọc, okurigana kết thúc từ bằng kana."
  rule:
    en: "A kanji with okurigana takes its kun reading; a word of two kanji takes on readings:"
    uk: "Кандзі з окуріґана читається за кунним читанням, а слово з двох кандзі — за онним:"
    es: "Un kanji con okurigana se lee con la lectura kun; una palabra de dos kanji, con las lecturas on:"
    pt: "Um kanji com okurigana usa a leitura kun; uma palavra de dois kanji usa as leituras on:"
    fr: "Un kanji suivi d’okurigana se lit en lecture kun ; un mot de deux kanji se lit en lectures on :"
    de: "Ein Kanji mit Okurigana wird kun gelesen; ein Wort aus zwei Kanji meist on:"
    it: "Un kanji con okurigana si legge kun; una parola di due kanji si legge on:"
    pl: "Kanji z okurigana czyta się czytaniem kun, a wyraz z dwóch kanji czytaniem on:"
    tr: "Okurigana alan kanji kun okunuşuyla, iki kanjili sözcük on okunuşlarıyla okunur:"
    id: "Kanji dengan okurigana dibaca kun; kata dua kanji dibaca on:"
    vi: "Kanji kèm okurigana đọc theo âm kun; từ hai kanji đọc theo âm on:"
  ex: { examples: [[{ target: { kanji: "食", reading: "た" } }, "べます"], { target: { kanji: "学生", reading: "がくせい" } }] }
