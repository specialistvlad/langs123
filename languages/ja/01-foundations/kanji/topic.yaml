  - title:
      en: "Furigana and okurigana"
      uk: "Фуріґана й окуріґана"
      es: "Furigana y okurigana"
      pt: "Furigana e okurigana"
      fr: "Furigana et okurigana"
      de: "Furigana und Okurigana"
      it: "Furigana e okurigana"
      pl: "Furigana i okurigana"
      tr: "Furigana ve okurigana"
      id: "Furigana dan okurigana"
      vi: "Furigana và okurigana"
    role: "own"
    content:
      - type: "usage"
        columns:
          - { key: "point", label: { en: "Point", uk: "Пункт", es: "Punto", pt: "Ponto", fr: "Point", de: "Aspekt", it: "Punto", pl: "Zagadnienie", tr: "Konu", id: "Poin", vi: "Điểm ngữ pháp" } }
          - { key: "rule", label: { en: "Rule", uk: "Правило", es: "Regla", pt: "Regra", fr: "Règle", de: "Regel", it: "Regola", pl: "Zasada", tr: "Kural", id: "Aturan", vi: "Quy tắc" } }
          - { key: "ex", label: { en: "Example", uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - level: "A1"
            point: { en: "furigana", uk: "furigana", es: "furigana", pt: "furigana", fr: "furigana", de: "furigana", it: "furigana", pl: "furigana", tr: "furigana", id: "furigana", vi: "furigana" }
            rule:
              en: "Small hiragana beside or above a kanji give its reading."
              uk: "Маленька хірагана поряд із кандзі або над ним показує його читання."
              es: "Pequeñas hiragana junto a un kanji o sobre él dan su lectura."
              pt: "Pequenos hiragana ao lado de um kanji ou sobre ele dão a sua leitura."
              fr: "De petits hiragana à côté d’un kanji ou au-dessus donnent sa lecture."
              de: "Kleine Hiragana neben oder über einem Kanji geben seine Lesung an."
              it: "Piccoli hiragana accanto o sopra un kanji ne danno la lettura."
              pl: "Małe hiragana obok kanji lub nad nim podają jego czytanie."
              tr: "Kanjinin yanındaki ya da üstündeki küçük hiragana okunuşunu verir."
              id: "Hiragana kecil di samping atau di atas kanji menunjukkan bacaannya."
              vi: "Hiragana nhỏ bên cạnh hoặc phía trên kanji cho biết cách đọc."
            ex: { target: { kanji: "私", reading: "わたし" } }
            tr: { en: "I, me", uk: "я", es: "yo", pt: "eu", fr: "je, moi", de: "ich", it: "io", pl: "ja", tr: "ben", id: "saya", vi: "tôi" }
          - level: "A1"
            point: { en: "okurigana", uk: "okurigana", es: "okurigana", pt: "okurigana", fr: "okurigana", de: "okurigana", it: "okurigana", pl: "okurigana", tr: "okurigana", id: "okurigana", vi: "okurigana" }
            rule:
              en: "Okurigana are the kana after a kanji: the kanji gives the stem, the kana the ending."
              uk: "Окуріґана — кана після кандзі: кандзі дає основу, кана — закінчення."
              es: "Las okurigana son la kana tras un kanji: el kanji da la raíz y la kana la terminación."
              pt: "Okurigana são os kana depois de um kanji: o kanji dá o radical e o kana a terminação."
              fr: "Les okurigana sont les kana après un kanji : le kanji donne le radical, le kana la terminaison."
              de: "Okurigana sind die Kana nach einem Kanji: Das Kanji gibt den Stamm, das Kana die Endung."
              it: "Le okurigana sono i kana dopo un kanji: il kanji dà la radice, il kana la desinenza."
              pl: "Okurigana to kana po kanji: kanji daje temat, kana końcówkę."
              tr: "Okurigana, kanjiden sonra gelen kanadır: kanji kökü, kana eki verir."
              id: "Okurigana adalah kana setelah kanji: kanji memberi pangkal, kana memberi akhiran."
              vi: "Okurigana là kana đứng sau kanji: kanji cho gốc từ, kana cho đuôi."
            ex: [{ kanji: "食", reading: "た" }, { target: "べる" }]
            tr: { en: "to eat", uk: "їсти", es: "comer", pt: "comer", fr: "manger", de: "essen", it: "mangiare", pl: "jeść", tr: "yemek", id: "makan", vi: "ăn" }
          - level: "A1"
            point:
              en: "Verb endings"
              uk: "Закінчення дієслів"
              es: "Terminaciones verbales"
              pt: "Terminações verbais"
              fr: "Terminaisons verbales"
              de: "Verbendungen"
              it: "Desinenze verbali"
              pl: "Końcówki czasowników"
              tr: "Fiil ekleri"
              id: "Akhiran kata kerja"
              vi: "Đuôi động từ"
            rule:
              en: "The ending changes with the form; the kanji never changes."
              uk: "Закінчення змінюється з формою; кандзі не змінюється ніколи."
              es: "La terminación cambia con la forma; el kanji nunca cambia."
              pt: "A terminação muda com a forma; o kanji nunca muda."
              fr: "La terminaison change avec la forme ; le kanji ne change jamais."
              de: "Die Endung ändert sich mit der Form; das Kanji nie."
              it: "La desinenza cambia con la forma; il kanji non cambia mai."
              pl: "Końcówka zmienia się z formą; kanji nigdy się nie zmienia."
              tr: "Ek biçime göre değişir; kanji asla değişmez."
              id: "Akhiran berubah menurut bentuk; kanji tidak pernah berubah."
              vi: "Đuôi thay đổi theo dạng; kanji không bao giờ đổi."
            ex: { examples: [[{ kanji: "食", reading: "た" }, { target: "べます" }], [{ kanji: "食", reading: "た" }, { target: "べません" }], [{ kanji: "食", reading: "た" }, { target: "べましょう" }]] }
            tr: { en: { examples: ["I eat.", "I do not eat.", "Let’s eat."] }, uk: { examples: ["Я їм.", "Я не їм.", "Давайте їсти."] }, es: { examples: ["Como.", "No como.", "Comamos."] }, pt: { examples: ["Eu como.", "Eu não como.", "Vamos comer."] }, fr: { examples: ["Je mange.", "Je ne mange pas.", "Mangeons."] }, de: { examples: ["Ich esse.", "Ich esse nicht.", "Lasst uns essen."] }, it: { examples: ["Mangio.", "Non mangio.", "Mangiamo."] }, pl: { examples: ["Jem.", "Nie jem.", "Jedzmy."] }, tr: { examples: ["Yerim.", "Yemem.", "Yiyelim."] }, id: { examples: ["Saya makan.", "Saya tidak makan.", "Ayo makan."] }, vi: { examples: ["Tôi ăn.", "Tôi không ăn.", "Chúng ta ăn nhé."] } }
          - level: "A1"
            point:
              en: "い-adjectives"
              uk: "い-прикметники"
              es: "Los adjetivos い"
              pt: "Os adjetivos い"
              fr: "Les adjectifs en い"
              de: "Die い-Adjektive"
              it: "Gli aggettivi in い"
              pl: "Przymiotniki い"
              tr: "い sıfatları"
              id: "Kata sifat い"
              vi: "Tính từ い"
            rule:
              en: "A い-adjective writes its ending in kana: only the kana change."
              uk: "У い-прикметнику закінчення пишеться каною: змінюється лише вона."
              es: "Un adjetivo い escribe su terminación en kana: solo cambian las kana."
              pt: "Um adjetivo い escreve a terminação em kana: só os kana mudam."
              fr: "Un adjectif en い écrit sa terminaison en kana : seuls les kana changent."
              de: "Ein い-Adjektiv schreibt seine Endung in Kana: nur die Kana ändern sich."
              it: "Un aggettivo in い scrive la desinenza in kana: cambiano solo i kana."
              pl: "Przymiotnik い zapisuje końcówkę kaną: zmienia się tylko kana."
              tr: "Bir い sıfatı ekini kanayla yazar: yalnızca kana değişir."
              id: "Kata sifat い menulis akhirannya dengan kana: hanya kana yang berubah."
              vi: "Tính từ い viết đuôi bằng kana: chỉ kana thay đổi."
            ex: { examples: [[{ kanji: "大", reading: "おお" }, { target: "きい" }, "です"], [{ kanji: "大", reading: "おお" }, { target: "きくない" }, "です"]] }
            tr: { en: { examples: ["It is big.", "It is not big."] }, uk: { examples: ["Це велике.", "Це не велике."] }, es: { examples: ["Es grande.", "No es grande."] }, pt: { examples: ["É grande.", "Não é grande."] }, fr: { examples: ["C’est grand.", "Ce n’est pas grand."] }, de: { examples: ["Es ist groß.", "Es ist nicht groß."] }, it: { examples: ["È grande.", "Non è grande."] }, pl: { examples: ["To jest duże.", "To nie jest duże."] }, tr: { examples: ["Büyük.", "Büyük değil."] }, id: { examples: ["Besar.", "Tidak besar."] }, vi: { examples: ["Nó to.", "Nó không to."] } }
      - type: "list"
        items:
          - type: "note"
            level: "A1"
            text:
              en: ["The forms of verbs and adjectives are taught in ", { link: "The ます-Form", to: ja.verbs.masu-form }, " and ", { link: "い-Adjectives", to: ja.adjectives.i-adjectives }, "."]
              uk: ["Форми дієслів і прикметників викладено в темах ", { link: "ます-форма", to: ja.verbs.masu-form }, " та ", { link: "い-прикметники", to: "ja.adjectives.i-adjectives" }, "."]
              es: ["Las formas de verbos y adjetivos se explican en ", { link: "La forma ます", to: "ja.verbs.masu-form" }, " y ", { link: "Los adjetivos い", to: "ja.adjectives.i-adjectives" }, "."]
              pt: ["As formas de verbos e adjetivos são explicadas em ", { link: "A forma ます", to: "ja.verbs.masu-form" }, " e ", { link: "Os adjetivos い", to: "ja.adjectives.i-adjectives" }, "."]
              fr: ["Les formes des verbes et des adjectifs sont présentées dans ", { link: "La forme en ます", to: "ja.verbs.masu-form" }, " et ", { link: "Les adjectifs en い", to: "ja.adjectives.i-adjectives" }, "."]
              de: ["Die Formen von Verben und Adjektiven stehen in ", { link: "Die ます-Form", to: "ja.verbs.masu-form" }, " und ", { link: "Die い-Adjektive", to: "ja.adjectives.i-adjectives" }, "."]
              it: ["Le forme di verbi e aggettivi sono presentate in ", { link: "La forma in ます", to: "ja.verbs.masu-form" }, " e ", { link: "Gli aggettivi in い", to: "ja.adjectives.i-adjectives" }, "."]
              pl: ["Formy czasowników i przymiotników omówiono w tematach ", { link: "Forma ます", to: "ja.verbs.masu-form" }, " i ", { link: "Przymiotniki い", to: "ja.adjectives.i-adjectives" }, "."]
              tr: ["Fiil ve sıfat biçimleri ", { link: "ます biçimi", to: "ja.verbs.masu-form" }, " ve ", { link: "い sıfatları", to: "ja.adjectives.i-adjectives" }, " konularında anlatılır."]
              id: ["Bentuk kata kerja dan kata sifat dijelaskan dalam ", { link: "Bentuk ます", to: "ja.verbs.masu-form" }, " dan ", { link: "Kata sifat い", to: "ja.adjectives.i-adjectives" }, "."]
              vi: ["Các dạng của động từ và tính từ được giải thích trong ", { link: "Thể ます", to: "ja.verbs.masu-form" }, " và ", { link: "Tính từ い", to: "ja.adjectives.i-adjectives" }, "."]
  - title:
      en: "Numbers and money"
      uk: "Числа й гроші"
      es: "Números y dinero"
      pt: "Números e dinheiro"
      fr: "Nombres et argent"
      de: "Zahlen und Geld"
      it: "Numeri e denaro"
      pl: "Liczby i pieniądze"
      tr: "Sayılar ve para"
      id: "Angka dan uang"
      vi: "Số và tiền"
    role: "own"
    content:
      - type: "list"
        items:
          - type: "note"
            level: "A1"
            text:
              en: "Each row gives the on readings in katakana, then after the slash the kun readings in hiragana; a dot sets the okurigana apart."
              uk: "У кожному рядку спершу онні читання катаканою, а після скісної риски кунні читання хіраганою; крапка відокремлює окуріґана."
              es: "Cada fila da las lecturas on en katakana y, tras la barra, las lecturas kun en hiragana; un punto separa la okurigana."
              pt: "Cada linha traz as leituras on em katakana e, depois da barra, as leituras kun em hiragana; um ponto separa o okurigana."
              fr: "Chaque ligne donne les lectures on en katakana, puis après la barre les lectures kun en hiragana ; un point sépare l’okurigana."
              de: "Jede Zeile nennt die On-Lesungen in Katakana, nach dem Schrägstrich die Kun-Lesungen in Hiragana; ein Punkt trennt das Okurigana ab."
              it: "Ogni riga dà le letture on in katakana e, dopo la barra, le letture kun in hiragana; un punto separa l’okurigana."
              pl: "Każdy wiersz podaje czytania on katakaną, a po ukośniku czytania kun hiraganą; kropka oddziela okurigana."
              tr: "Her satır on okunuşlarını katakanayla, eğik çizgiden sonra kun okunuşlarını hiraganayla verir; nokta okuriganayı ayırır."
              id: "Setiap baris memuat bacaan on dalam katakana, lalu setelah garis miring bacaan kun dalam hiragana; titik memisahkan okurigana."
