              en: { term: "カタカナ" }
              uk: { term: "カタカナ" }
              es: { term: "カタカナ" }
              pt: { term: "カタカナ" }
              fr: { term: "カタカナ" }
              de: { term: "カタカナ" }
              it: { term: "カタカナ" }
              pl: { term: "カタカナ" }
              tr: { term: "カタカナ" }
              id: { term: "カタカナ" }
              vi: { term: "カタカナ" }
            use:
              en: "Foreign words and names."
              uk: "Іншомовні слова й імена."
              es: "Palabras y nombres extranjeros."
              pt: "Palavras e nomes estrangeiros."
              fr: "Mots et noms étrangers."
              de: "Fremdwörter und fremde Namen."
              it: "Parole e nomi stranieri."
              pl: "Wyrazy i imiona obce."
              tr: "Yabancı sözcükler ve adlar."
              id: "Kata dan nama asing."
              vi: "Từ và tên nước ngoài."
            ex: [{ target: "コーヒー" }, "を", { kanji: "飲", reading: "の" }, "みます。"]
            tr: { en: "I drink coffee.", uk: "Я п’ю каву.", es: "Bebo café.", pt: "Eu bebo café.", fr: "Je bois du café.", de: "Ich trinke Kaffee.", it: "Bevo il caffè.", pl: "Piję kawę.", tr: "Kahve içiyorum.", id: "Saya minum kopi.", vi: "Tôi uống cà phê." }
      - type: "list"
        items:
          - type: "note"
            level: "A1"
            text:
              en: "Japanese has no spaces; the change from kanji to kana shows where words begin."
              uk: "У японській немає пробілів; перехід від кандзі до кани показує межі слів."
              es: "El japonés no usa espacios; el paso de kanji a kana marca dónde empiezan las palabras."
              pt: "O japonês não usa espaços; a passagem de kanji para kana mostra onde as palavras começam."
              fr: "Le japonais n’emploie pas d’espaces ; le passage du kanji au kana montre où les mots commencent."
              de: "Das Japanische schreibt ohne Leerzeichen; der Wechsel von Kanji zu Kana zeigt, wo Wörter beginnen."
              it: "Il giapponese non usa spazi; il passaggio da kanji a kana mostra dove iniziano le parole."
              pl: "Japoński pisze się bez spacji; przejście od kanji do kany pokazuje początek wyrazów."
              tr: "Japoncada boşluk yoktur; kanjiden kanaya geçiş sözcüklerin nerede başladığını gösterir."
              id: "Bahasa Jepang tidak memakai spasi; peralihan dari kanji ke kana menunjukkan awal kata."
              vi: "Tiếng Nhật không dùng dấu cách; chỗ chuyển từ kanji sang kana cho biết từ bắt đầu ở đâu."
            ex: [{ kanji: "私", reading: "わたし" }, "はコーヒーを", { kanji: "飲", reading: "の" }, "みます。"]
            tr: { en: "I drink coffee.", uk: "Я п’ю каву.", es: "Bebo café.", pt: "Eu bebo café.", fr: "Je bois du café.", de: "Ich trinke Kaffee.", it: "Bevo il caffè.", pl: "Piję kawę.", tr: "Kahve içiyorum.", id: "Saya minum kopi.", vi: "Tôi uống cà phê." }
          - type: "note"
            level: "A1"
            text:
              en: ["The kana are taught in ", { link: "Hiragana", to: "ja.foundations.hiragana" }, " and ", { link: "Katakana", to: "ja.foundations.katakana" }, "."]
              uk: ["Кани викладено в темах ", { link: "Хірагана", to: "ja.foundations.hiragana" }, " і ", { link: "Катакана", to: "ja.foundations.katakana" }, "."]
              es: ["Las kana se explican en ", { link: "Hiragana", to: "ja.foundations.hiragana" }, " y ", { link: "Katakana", to: "ja.foundations.katakana" }, "."]
              pt: ["Os kana são explicados em ", { link: "Hiragana", to: "ja.foundations.hiragana" }, " e ", { link: "Katakana", to: "ja.foundations.katakana" }, "."]
              fr: ["Les kana sont présentés dans ", { link: "Hiragana", to: "ja.foundations.hiragana" }, " et ", { link: "Katakana", to: "ja.foundations.katakana" }, "."]
              de: ["Die Kana stehen in ", { link: "Hiragana", to: "ja.foundations.hiragana" }, " und ", { link: "Katakana", to: "ja.foundations.katakana" }, "."]
              it: ["I kana sono presentati in ", { link: "Hiragana", to: "ja.foundations.hiragana" }, " e ", { link: "Katakana", to: "ja.foundations.katakana" }, "."]
              pl: ["Kany omówiono w tematach ", { link: "Hiragana", to: "ja.foundations.hiragana" }, " i ", { link: "Katakana", to: "ja.foundations.katakana" }, "."]
              tr: ["Kanalar ", { link: "Hiragana", to: "ja.foundations.hiragana" }, " ve ", { link: "Katakana", to: "ja.foundations.katakana" }, " konularında anlatılır."]
              id: ["Kana dijelaskan dalam ", { link: "Hiragana", to: "ja.foundations.hiragana" }, " dan ", { link: "Katakana", to: "ja.foundations.katakana" }, "."]
              vi: ["Kana được giải thích trong ", { link: "Hiragana", to: "ja.foundations.hiragana" }, " và ", { link: "Katakana", to: "ja.foundations.katakana" }, "."]
