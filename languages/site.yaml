# yaml-language-server: $schema=schema/site.schema.json
# Product identity, licences and the explanation languages: the languages every guide is written in.
# Each explanation language names itself and the others.

name: langs123
url: https://langs123.com
repository: https://github.com/specialistvlad/langs123

# The content in languages/ carries the content licence and credits its authors as `credit`; the code
# carries the code licence. Every page shows both, and every reuse of the content names the credit.
credit: langs123 contributors
licences:
  content: { name: CC BY 4.0, url: https://creativecommons.org/licenses/by/4.0/ }
  code: { name: MIT, url: https://github.com/specialistvlad/langs123/blob/main/LICENSE }

# enabled: false keeps a language from readers for now; its data stays and npm run check still
# validates it. Languages being learned carry the same switch in curriculum.yaml.
explain:
  - code: en
    enabled: true
    name: { en: English, uk: Англійська, es: Inglés, pt: Inglês, fr: Anglais, de: Englisch, it: Inglese, pl: Angielski, tr: İngilizce, id: Bahasa Inggris, vi: Tiếng Anh }
  - code: uk
    enabled: true
    name: { en: Ukrainian, uk: Українська, es: Ucraniano, pt: Ucraniano, fr: Ukrainien, de: Ukrainisch, it: Ucraino, pl: Ukraiński, tr: Ukraynaca, id: Bahasa Ukraina, vi: Tiếng Ukraina }
  - code: es
    enabled: true
    name: { en: Spanish, uk: Іспанська, es: Español, pt: Espanhol, fr: Espagnol, de: Spanisch, it: Spagnolo, pl: Hiszpański, tr: İspanyolca, id: Bahasa Spanyol, vi: Tiếng Tây Ban Nha }
  - code: pt
    enabled: true
    name: { en: Portuguese, uk: Португальська, es: Portugués, pt: Português, fr: Portugais, de: Portugiesisch, it: Portoghese, pl: Portugalski, tr: Portekizce, id: Bahasa Portugis, vi: Tiếng Bồ Đào Nha }
  - code: fr
    enabled: true
    name: { en: French, uk: Французька, es: Francés, pt: Francês, fr: Français, de: Französisch, it: Francese, pl: Francuski, tr: Fransızca, id: Bahasa Prancis, vi: Tiếng Pháp }
  - code: de
    enabled: true
    name: { en: German, uk: Німецька, es: Alemán, pt: Alemão, fr: Allemand, de: Deutsch, it: Tedesco, pl: Niemiecki, tr: Almanca, id: Bahasa Jerman, vi: Tiếng Đức }
  - code: it
