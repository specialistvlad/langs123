    name: { en: Italian, uk: Італійська, es: Italiano, pt: Italiano, fr: Italien, de: Italienisch, it: Italiano, pl: Włoski, tr: İtalyanca, id: Bahasa Italia, vi: Tiếng Ý }
  - code: pl
